  // run readout — the honest breakdown
  const st = [
    ['GRAZES', sim.tierCount[2], P.red], ['CLOSE', sim.tierCount[1], P.amber],
    ['BANKS', sim.banks, P.gold], ['HITS', sim.mistakes, '#FF8A6E'],
  ];
  const cw = (W - 56) / 4;
  st.forEach((s, i) => {
    const x = 28 + cw * (i + 0.5);
    ctx.font = '800 9px ui-monospace,Menlo,monospace';
    ctx.fillStyle = P.dim; ctx.fillText(s[0], x, 142);
    ctx.font = '800 22px ui-monospace,Menlo,monospace';
    ctx.fillStyle = s[1] > 0 ? s[2] : 'rgba(200,220,235,.35)';
    ctx.fillText(s[1], x, 165);
  });
  ctx.fillStyle = 'rgba(160,215,240,.12)'; ctx.fillRect(34, 128, W - 68, 1);

  // retry — bottom-centre, thumb arc (§8.2), interactive at 750ms
  const live = ms > 750;
  const by = 300 - 100 - 26;
  ctx.globalAlpha = live ? 1 : 0.5;
  const bs = live ? 1 : 0.86;
  ctx.save(); ctx.translate(W / 2, by + 26); ctx.scale(bs, bs); ctx.translate(-W / 2, -(by + 26));
  const gg = ctx.createLinearGradient(0, by, 0, by + 52);
  gg.addColorStop(0, '#3FE3C4'); gg.addColorStop(1, '#14A98F');
  ctx.fillStyle = gg; rr(W / 2 - 90, by, 180, 52, 26); ctx.fill();
  ctx.fillStyle = '#04211C'; ctx.font = '800 19px ui-monospace,Menlo,monospace';
  ctx.fillText('RETRY', W / 2, by + 33);
  ctx.restore(); ctx.globalAlpha = 1;

  ctx.font = '800 9px ui-monospace,Menlo,monospace'; ctx.fillStyle = P.dim;
  ctx.fillText('SEED ' + SEED.toString(36).toUpperCase().slice(-6) + '  ·  TAP ANYWHERE', W / 2, 288);
  ctx.restore();
}

function drawDebug(){
  ctx.font = '10px ui-monospace,Menlo,monospace'; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, H - 74, 210, 74);
  ctx.fillStyle = '#8FE'; let y = H - 62;
  const L = [
    't=' + sim.tick + ' wt=' + sim.wt + ' dEff=' + (DEFF[Math.min(sim.wt, DEFF.length - 1)]).toFixed(2),
    'row=' + sim.row + ' tide=' + sim.tideRow.toFixed(2) + ' lag=' + (sim.maxScored - sim.tideRow).toFixed(1),
    'pool=' + sim.pool + ' x' + sim.mult.toFixed(2) + ' streak=' + sim.streak + ' carry=' + sim.carry,
    'tiers ' + sim.tierCount.join('/') + '  hits ' + sim.trafficHits + '/' + sim.tideHits,
    'late=' + sim.lateScore + ' (' + (sim.score ? Math.round(sim.lateScore / sim.score * 100) : 0) + '%)',
  ];
  for (const s of L){ ctx.fillText(s, 6, y); y += 12; }
}

/* =========================== TEST / BOT HOOKS ==========================
   Exposed for src/_grazebot.js. __pump drives the REAL input path — the bots
   dispatch actual pointer events (memory: prototype-exploit-testing) and the
   latch is sampled at the top of the tick, so a press+release inside one
   frame cannot be dropped (memory: prototype-build-gates). */
window.__GRAZE = {
  get sim(){ return sim; }, get RUN(){ return RUN; },
  makeSim, replay, serializeTrace, deserializeTrace,
  SESSION_TICKS, HOP_TICKS, BANK_TICKS, BASE, BASE_LATE, RUNG, MULT_CAP,
  SHAVE_T, CLOSE_T, COLS, CELL, GRID_X, ROW_H, SPAN, LX0, DEFF, SPDL, CUMS,
  TIDE_DMG, DMG_CAP, CLOSING_TICKS, SHORE, LANE, DIRS,
  setSeed(s){ SEED = s >>> 0; newRun(); },
  reset(s){ if (s !== undefined) SEED = s >>> 0; newRun(); },
  // advance n ticks; fn(tick, sim) may dispatch DOM events or set the latch
  pump(n, fn){
    for (let i = 0; i < n && !RUN.ended; i++){
      if (fn) fn(sim.tick, sim);
      stepOnce();
    }
    FX.camRow = sim.row;          // headless pumping skips the camera lerp
    return sim;
  },
  // real DOM gesture, resolved by the same handlers a finger uses
  gesture(dir, subframe){
    const r = cv.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const d = [[0, -60], [0, 60], [-60, 0], [60, 0]][dir];
    const mk = (type, x, y) => new PointerEvent(type, { clientX: x, clientY: y, bubbles: true, pointerId: 1 });
    cv.dispatchEvent(mk('pointerdown', cx, cy));
    if (subframe) { /* no tick between down and up — the §gate case */ }
    dispatchEvent(mk('pointerup', cx + d[0] * scl, cy + d[1] * scl));
  },
  tap(){
    const r = cv.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const mk = (t2, x, y) => new PointerEvent(t2, { clientX: x, clientY: y, bubbles: true, pointerId: 1 });
    cv.dispatchEvent(mk('pointerdown', cx, cy)); dispatchEvent(mk('pointerup', cx, cy));
  },
  get latch(){ return latch; }, setLatch(d){ latch = d; },
  /* The presentation loop itself. rAF does not fire in a backgrounded pane,
     so this is the one link __pump cannot exercise — exposed so it can be
     driven with synthetic timestamps and proven to advance the sim. */
  frame(now){ frame(now); },
};
