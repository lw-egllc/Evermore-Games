<title>Slice the Sweets</title>

/* --------------------------------------------------------------------------
   Everything is sized in viewport-relative units or in px derived at runtime
   from the measured stage. An absolute px constant inside a viewport-relative
   layout is a latent bug — it looks right until something changes the viewport
   out from under it.
   -------------------------------------------------------------------------- */
:root{
  --navy:#241a66; --navy2:#150e42;
  --pink:#ff3f9c; --pink2:#ff8fd0; --hot:#ff69b8;
  --cream:#fff6ea; --gold:#ffc93c; --gold2:#ff9d2e;
  --mint:#2fd6b0;
  --f: Comfortaa, ui-rounded, "SF Pro Rounded", system-ui, -apple-system,
       "Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  /* The widget height is SOLVED for, not picked: the four exported aspects sum
     to 8.092, so a row of them at height h plus three gaps has to fit inside
     the stage minus its margins. Deriving h from that means the row always
     spans the same fraction of the width and can never overflow — a hand-tuned
     vw figure only holds at the viewport you happened to check.
       2.579 (timer) + 2.587 (score) + 1.958 (streak) + 0.968 (gear) = 8.092
     Capped in px so a tablet or a landscape container does not get a giant HUD;
     floored in px so the margins do not vanish on a 320-wide phone. */
  --hud-pad: calc(max(10px, 2.6vw)
                 + max(env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px)));
  --hud-gap: max(6px, 1.7vw);
  --hud-h: min(calc((100vw - 2 * var(--hud-pad) - 3 * var(--hud-gap)) / 8.092), 72px);
}

#scrim{position:absolute;inset:0;transition:background .5s ease, opacity .5s ease;
  background:
    radial-gradient(120% 78% at 50% 34%, rgba(20,6,34,0) 28%, rgba(20,6,34,.34) 74%, rgba(14,3,26,.62) 100%),
    linear-gradient(180deg, rgba(24,7,40,.34) 0%, rgba(24,7,40,0) 26%, rgba(24,7,40,0) 62%, rgba(16,4,28,.40) 100%);}
body.playing #scrim{background:
    radial-gradient(120% 78% at 50% 34%, rgba(20,6,34,.10) 28%, rgba(20,6,34,.44) 74%, rgba(14,3,26,.70) 100%),
    linear-gradient(180deg, rgba(24,7,40,.44) 0%, rgba(24,7,40,.06) 26%, rgba(24,7,40,.06) 62%, rgba(16,4,28,.48) 100%);}
#danger{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s ease;
  background:radial-gradient(120% 80% at 50% 50%, rgba(255,0,60,0) 46%, rgba(255,0,70,.30) 100%);}
body.hurry #danger{opacity:1;animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

#cv{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* ---------------- HUD ---------------- */
#hud{position:absolute;left:0;right:0;top:calc(2.8vh + env(safe-area-inset-top,0px));
  display:flex;justify-content:center;align-items:center;gap:var(--hud-gap);
  pointer-events:none;opacity:0;transition:opacity .3s ease;}
body.playing #hud, body.over #hud{opacity:1;}
body.over #wGear{visibility:hidden;}

/* Each widget draws at its OWN aspect from the exported art, all at one
   height. Streak is genuinely narrower than Score and Timer — it was exported
   233x119 against their 313x121 — and stretching it to match would distort the
   artist's rounding. Equal heights are what make a row read as a row. */

#wGear::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:max(100%,44px);height:max(100%,44px);}
#wGear:active{transform:scale(.92);}

/* The value sits in the empty half of the pill, left of the icon. Both edges
   are measured off the art, not guessed: the icons are at 0.712-0.897 of the
   timer's width, 0.677-0.872 of the score's and 0.622-0.773 of the streak's. */
.val{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--f);font-weight:700;color:#fff;line-height:1;
  font-size:calc(var(--hud-h)*0.44);
  text-shadow:0 .08em 0 rgba(2,8,48,.7), 0 0 .5em rgba(0,20,90,.5);}
#wTimer .val {left:5.44%;right:31.72%;}
#wScore .val {left:5.52%;right:35.19%;}
#wStreak .val{left:6.58%;right:41.25%;}
/* Comfortaa has no tnum feature and its digits are proportional — '1' is
   0.393 em against '4' at 0.653 em — so a countdown visibly shuffles its
   neighbours every tick. Each character gets its own fixed cell instead. */
.val i{font-style:normal;display:inline-block;width:.64em;text-align:center;}
.val i.sep{width:.30em;}

body.hurry #wTimer .val{color:var(--gold);animation:tick 1s steps(1) infinite;}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.10)}}
body.timehit #wTimer{animation:hit .5s ease;}
@keyframes hit{0%,100%{transform:scale(1)}35%{transform:scale(1.14)}}
body.timehit #wTimer .val{color:#ff6a6a;}
body.streakhit #wStreak{animation:hit .5s ease;}
.val.t2{color:#5fdcff;} .val.t3{color:var(--gold);} .val.t4{color:#ff8ade;}

"use strict";
/* ---- Evermore board bridge ---------------------------------------------
   Standalone this is inert. Embedded, it carries the score and the payout
   back to the board. postMessage is the whole contract: two file:// docs are
   opaque origins to each other, so direct scripting across the frame boundary
   is blocked, but postMessage is not. */
const GAME_KEY = 'SliceTheSweets';
const EMBEDDED = (() => { try { return !!window.parent && window.parent !== window; }
                          catch (e) { return false; } })();
const EVERMORE = {
  /* CENTS per band. These are the BOARD's numbers and it overwrites them on
     init; they are duplicated here so the game still shows honest payouts
     when opened on its own. */
  rewards: { low: 1, med: 2, high: 3 },

  /* SCORE goals — DERIVED, not invented. 1,500 simulated first-contact runs
     through the real update loop and the real scoring gave 4500 / 2700 / 1000,
     clearing 10.7% / 32.5% / 83.1%. Full derivation, including the floor test
     against seven ways of not playing properly, is at the foot of this file. */
  thresholds: { low: 1000, med: 2700, high: 4500 },

  band(score) {
    if (score >= this.thresholds.high) return 'high';
    if (score >= this.thresholds.med)  return 'med';
    if (score >= this.thresholds.low)  return 'low';
    return 'none';                         // under the lowest goal pays nothing
  },
  cents(score) {
    const b = this.band(score);
    return b === 'none' ? 0 : (this.rewards[b] | 0);
  },
  cash(score) { return '$' + (this.cents(score) / 100).toFixed(2); },   // "$0.02"

  /* The HOME button on the result screen calls this and nothing else.
     Returns true if the board took it, so standalone can restart instead. */
  home(score) {
    if (!EMBEDDED) return false;
    try {
      parent.postMessage({ evermore: 'complete', game: GAME_KEY,
                           score: score | 0, band: this.band(score),
                           cents: this.cents(score) }, '*');
    } catch (e) {}
    return true;
  },
};
window.addEventListener('message', (e) => {
  const d = e && e.data;
  if (d && d.evermore === 'init' && d.rewards) { Object.assign(EVERMORE.rewards, d.rewards); paintGoals(); }
});

/* rAF alone must never be the only thing that dismisses a load card — a

   loader is a total loss. boot() is idempotent, so whichever fires first wins. */
setTimeout(boot, 4000);

/* ============================ STAGE ====================================== */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d', { alpha: true });
let W = 0, H = 0, DPR = 1, rect = { left: 0, top: 0 };

/* Derived every layout — never magic fractions that only work at one viewport */
let DS = 90;          // dessert visual mass in CSS px (its sqrt(w*h))
let RAD = 45;         // slice radius
let GRAV = 1000;      // px/s^2
let BLADE_W = 16;

function layout(){
  DS   = Math.max(44, Math.min(W * 0.245, H * 0.132));
  RAD  = DS * 0.50;
  GRAV = H * 1.15;
  BLADE_W = Math.max(10, DS * 0.24);
}

function resize(){
  const vv = window.visualViewport;
  const vh = vv ? vv.height : window.innerHeight;
  /* measured, not inferred — mobile Safari's 100vh is the LARGE viewport */
  document.documentElement.style.setProperty('--vph', vh + 'px');
  const r = stage.getBoundingClientRect();
  rect = { left: r.left, top: r.top };
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));
/* iOS fires this one — and only this one — when the toolbars move */
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

/* ============================ RNG ======================================== */
/* Seedable so the threshold sim is reproducible; seeded from time in play. */
let _s = 0x9e3779b9;
function srand(n){ _s = (n >>> 0) || 1; }
function rnd(){
  _s ^= _s << 13; _s >>>= 0; _s ^= _s >> 17; _s ^= _s << 5; _s >>>= 0;
  return _s / 4294967296;
}
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));

/* ============================ TUNING ===================================== */
const ROUND       = 60;      // seconds
const BASE        = 35;      // points per dessert
const PERFECT     = 40;      // bonus for a cut through the middle
const PERFECT_D   = 0.26;    // ... within this fraction of the radius
const GOLD_MULT   = 3;       // golden dessert multiplier on base + perfect
/* A bomb costs POINTS AND CLOCK, and the clock is the part that matters.
   Points alone could not hold the floor: the score is clamped at zero so the
   player is never shown a hole they cannot see out of, and that clamp turns a
   points-only penalty into a ratchet — once a masher bottoms out, every later
   bomb is free while every slice still pays, so their best runs random-walked
   back up past most people who were genuinely trying. Time cannot ratchet.
   Measured: the two together drop the MEDIAN run of every bad-play strategy
   to between 0 and 210 against a bronze goal of 800, while costing a good
   player who eats three bombs about an eighth of their round.
   See "Threshold derivation" at the foot of the file. */
const BOMB_COST   = 300;
const BOMB_TIME   = 2.5;     // seconds torn off the clock
const BOMB_FREEZE = 0.90;    // seconds the blade is dead after a bomb
const BOMB_DUE    = 4.6;     // no run gets a bomb-free stretch longer than this
/* SWIPE_WIN only groups the slices of one stroke so the HUD can say "4 in one
   swipe". It pays nothing — cutting four at once is worth exactly four slices,
   and it is already the better play because it is FASTER and a dessert you did
   not reach in time falls and takes the streak with it. That incentive is
   emergent, so it does not need a second scoring system bolted beside the
   first. */
const SWIPE_WIN   = 0.42;
/* STREAK is the whole scoring system. It counts desserts cut in a row and
   breaks the moment one falls or you touch a bomb, and its tier multiplies what
   every slice is worth. It is also the only thing that makes MISSING cost
   anything: the round has no points penalty for a dropped dessert on purpose —
   subtracting from a first-timer who is already drowning reads as punishment —
   so without it, ignoring one was free. Losing a multiplier you can watch in
   the HUD is a cost the player understands without being told.

   It used to be two features. A separate per-swipe COMBO paid a flat bonus for
   cutting 2+ in one stroke, and the two competed for the same idea and the same
   word — players read the running counter as "the combo", which is what the
   pill is called now. Merged, a multi-cut still matters: it advances the streak
   several steps at once, and it does not need its own economy to do that. */
const STREAK_AT   = [0, 3, 10];      // streak needed for each tier
const STREAK_MULT = [1, 1.4, 1.8];    // what a slice is worth at that tier
function streakMult(){
  let m = STREAK_MULT[0];
  for (let i = 1; i < STREAK_AT.length; i++) if (streak >= STREAK_AT[i]) m = STREAK_MULT[i];
  return m;
}
function streakTier(){
  let t = 0;
  for (let i = 1; i < STREAK_AT.length; i++) if (streak >= STREAK_AT[i]) t = i;
  return t;
}

/* ============================ STATE ====================================== */
let state = 'title';         // title | play | pause | over
let score = 0, timeLeft = ROUND, elapsed = 0;
let sliced = 0, missed = 0, bombs = 0, bestSwipe = 0;   // run stats
let streak = 0, bestStreak = 0, streakHit = 0, lastMult = 1, taughtTier = false;
const sweets = [], halves = [], parts = [], pops = [];
let spawnT = 0, shake = 0, freeze = 0, overAt = 0, flashT = 0, goT = 0, lastBomb = 0, timePen = 0, timeHit = 0;
let swipe = { n: 0, last: -9, x: 0, y: 0 };            // this stroke's slices
let banner = null;
let sim = false;             // true inside the threshold simulation

/* ============================ SPAWNING =================================== */
/* Difficulty is one curve over the round: groups get bigger and closer
   together and bombs appear once the player has had a few seconds to learn the
   swipe. Everything below is per-second / per-item so it stays honest if ROUND
   changes. */
function spawnParams(p){
  const e = p * p;                                   // ease-in
  return {
    gap:  rr(0.86, 1.16) * (1.30 + (0.85 - 1.30) * e),
    size: 1 + (rnd() < (0.30 + 1.10 * e) ? 1 : 0) + (rnd() < (0.02 + 0.55 * e) ? 1 : 0)
            + (rnd() < (0.00 + 0.22 * e) ? 1 : 0),
    bomb: p < 0.07 ? 0 : Math.min(0.22, 0.06 + 0.18 * e),
    gold: 0.05,
  };
}

function launch(kind, slow){
  const y0   = H + DS * 0.6;
  const rise = H * (slow ? rr(0.50, 0.62) : rr(0.62, 0.86));
  const vy   = -Math.sqrt(2 * GRAV * rise);
  const x0   = W * rr(0.10, 0.90);
  const tA   = -vy / GRAV;
  const aim  = W * 0.5 + (rnd() - 0.5) * W * 0.5;
  let vx = (aim - x0) / tA;
  vx = Math.max(-W * 0.42, Math.min(W * 0.42, vx));
  const o = {
    kind, type: ri(0, NTYPES - 1), x: x0, y: y0, vx, vy,
    rot: rr(-0.6, 0.6), spin: rr(-3.2, 3.2), gold: false, dead: false, born: elapsed,
  };
  if (kind === 'bomb'){ o.spin = rr(-1.6, 1.6); o.rot = 0; }
  return o;
}

function spawnGroup(){
  const p = Math.max(0, Math.min(1, 1 - timeLeft / ROUND));
  const sp = spawnParams(p);
  spawnT = sp.gap;
  const n = Math.min(4, sp.size);
  /* A purely probabilistic bomb rate leaves a fat lucky tail: the best runs of
     a player who is not aiming at all were the runs that happened to draw few
     bombs, and those beat most people who were genuinely trying. One guaranteed
     bomb every BOMB_DUE seconds collapses that tail and makes the threat the
     same for everybody. */
  const due = elapsed > 6 && (elapsed - lastBomb) > BOMB_DUE;
  let bombed = false;
  for (let i = 0; i < n; i++){
    const isBomb = !bombed && ((due && i === n - 1) || rnd() < sp.bomb);
    if (isBomb){ bombed = true; lastBomb = elapsed; }
    const o = launch(isBomb ? 'bomb' : 'sweet');
    if (!isBomb && rnd() < sp.gold) o.gold = true;
    /* stagger inside the group so a group reads as a volley, not a wall */
    o.delay = i === 0 ? 0 : rr(0.04, 0.24);
    sweets.push(o);
  }
}

/* ============================ SLICING ==================================== */
const trail = [];            // {x,y,t}
let down = false, lastPt = null, ghost = null;

function pushPoint(x, y, t){
  const prev = lastPt;
  trail.push({ x, y, t });
  lastPt = { x, y, t };
  if (!prev) return;
  const dx = x - prev.x, dy = y - prev.y;
  const len = Math.hypot(dx, dy);
  if (len < DS * 0.07) return;             // a resting finger is not a slice
  if (freeze > 0) return;
  testSegment(prev.x, prev.y, x, y, dx / len, dy / len);
}

function testSegment(ax, ay, bx, by, ux, uy){
  for (let i = 0; i < sweets.length; i++){
    const o = sweets[i];
    if (o.dead || o.delay > 0) continue;
    const r = o.kind === 'bomb' ? RAD * 0.80 : RAD;
    const d = segDist(ax, ay, bx, by, o.x, o.y);
    if (d < 0 || d > r) continue;
    if (o.kind === 'bomb') hitBomb(o);
    else                   hitSweet(o, ux, uy, d / r);
  }
}

function segDist(ax, ay, bx, by, cx, cy){
  const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
  let t = L2 > 0 ? ((cx - ax) * dx + (cy - ay) * dy) / L2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return Math.hypot(cx - (ax + dx * t), cy - (ay + dy * t));
}

function hitSweet(o, ux, uy, acc){
  o.dead = true; sliced++;
  const m = ATLAS.meta[o.type];
  const k = DS / Math.sqrt(m.w * m.h);
  /* The pair is painted cut down a VERTICAL line, so to land the painted cut on
     the blade the pair rotates by (blade angle - 90 degrees). */
  const R = Math.atan2(uy, ux) - Math.PI / 2;
  const cs = Math.cos(R), sn = Math.sin(R);
  const kick = DS * rr(1.5, 2.1);
  for (const side of ['l', 'r']){
    const ox = (side === 'l' ? m.olx : m.orx) * k;
    const oy = (side === 'l' ? m.oly : m.ory) * k;
    const wx = ox * cs - oy * sn, wy = ox * sn + oy * cs;
    const s = side === 'l' ? -1 : 1;
    halves.push({
      type: o.type, side,
      x: o.x + wx, y: o.y + wy,
      vx: o.vx + cs * kick * s + rr(-30, 30),
      vy: o.vy + sn * kick * s - DS * rr(0.3, 1.0),
      rot: R, spin: rr(-2.2, 2.2) + s * 1.4, a: 1, k,
    });
  }
  streak++; if (streak > bestStreak) bestStreak = streak;
  const mult = streakMult();
  if (mult > lastMult){
    const tier = streakTier();
    lastMult = mult;
    /* The first tier lands after three slices, so a player who keeps breaking
       their streak would get the same banner every few seconds. Announce tier 1
       once, to teach it, and after that only the top tier is worth a banner —
       the pill's colour carries the rest. */
    if (tier >= 2 || !taughtTier){
      if (tier === 1) taughtTier = true;
      banner = { t: 0, kind: 'tier', mult, x: o.x, y: o.y };
      sfx.chime(3);
    }
  }
  const perfect = acc < PERFECT_D;
  let pts = Math.round((BASE + (perfect ? PERFECT : 0)) * mult);
  if (o.gold) pts *= GOLD_MULT;
  addScore(pts);
  burst(o.x, o.y, m.col, o.gold ? 26 : 16, o.gold);
  slash(o.x, o.y, ux, uy);
  pops.push({ x: o.x, y: o.y, t: 0, txt: (o.gold ? 'x3  ' : '') + '+' + pts,
              col: o.gold ? '#ffd23c' : (perfect ? '#ffffff' : '#ffe9f6'),
              big: o.gold || perfect });
  if (perfect) pops.push({ x: o.x, y: o.y - DS * 0.34, t: 0, txt: 'PERFECT', col: '#7ef0d4', big: false, small: true });

  /* group the slices of one stroke, for the banner only */
  if (elapsed - swipe.last > SWIPE_WIN) flushSwipe();
  swipe.n++; swipe.last = elapsed;
  swipe.x = swipe.n === 1 ? o.x : swipe.x * 0.5 + o.x * 0.5;
  swipe.y = swipe.n === 1 ? o.y : swipe.y * 0.5 + o.y * 0.5;
  sfx.slice(o.type, swipe.n);
}

function flushSwipe(){
  if (swipe.n > bestSwipe) bestSwipe = swipe.n;
  /* Three or more in one stroke is worth saying out loud — but never over the
     top of a tier-up, which is the more important thing that just happened. */
  if (swipe.n >= 3 && (!banner || banner.t > 0.30)){
    banner = { t: 0, kind: 'multi', n: swipe.n, streak, x: swipe.x, y: swipe.y };
    sfx.chime(swipe.n);
  }
  swipe.n = 0;
}

function hitBomb(o){
  o.dead = true; bombs++;
  addScore(-BOMB_COST);
  timePen += BOMB_TIME;
  flushSwipe(); breakStreak();
  freeze = BOMB_FREEZE; shake = 1; flashT = 0.36; timeHit = 0.55;
  trail.length = 0; lastPt = null;
  burst(o.x, o.y, '#ff5a3c', 34, false, true);
  pops.push({ x: o.x, y: o.y, t: 0, txt: '-' + BOMB_COST, col: '#ff6a6a', big: true });
  pops.push({ x: o.x, y: o.y - DS * 0.42, t: 0, txt: '-' + BOMB_TIME + 's', col: '#ffd23c', big: true });
  sfx.boom();
}

function addScore(n){ score = Math.max(0, score + n); }

function breakStreak(){
  /* only flash when there was something to lose — a first-timer missing their
     second dessert does not need the HUD shouting at them */
  if (streak >= 5) streakHit = 0.5;
  streak = 0; lastMult = 1;
}

/* ============================ PARTICLES ================================== */
function burst(x, y, col, n, gold, boom){
  if (parts.length > 190) return;
  for (let i = 0; i < n; i++){
    const a = rnd() * Math.PI * 2, sp = DS * rr(0.9, 3.4);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - DS * 0.5,
      r: DS * rr(0.035, 0.10) * (boom ? 1.5 : 1), life: 0, max: rr(0.45, 0.95),
      col: boom ? (rnd() < 0.5 ? '#ffb03c' : '#ff5a3c') : (gold && rnd() < 0.6 ? '#ffd23c' : col) });
  }
  for (let i = 0; i < 5; i++){
    const a = rnd() * Math.PI * 2, sp = DS * rr(1.2, 3.0);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - DS * 0.4,
      r: DS * rr(0.02, 0.05), life: 0, max: rr(0.30, 0.55), col: '#ffffff', spark: true });
  }
}
function slash(x, y, ux, uy){
  parts.push({ slashX: x, slashY: y, ux, uy, life: 0, max: 0.20, r: 0, col: '#fff' });
}

/* ============================ BOMB ART =================================== */
/* Bomb.png, measured rather than eyeballed. Two independent estimates of the
   ball's centre agree to 1.3 px — the widest dark row, and the ball's bottom
   edge minus its radius — so these normalised numbers are a real circle fit,
   not a guess at where the middle looks like it is.

   The art's fuse is UNLIT, so the spark stays procedural and is anchored on the
   rope's measured tip. A bomb that just sits there is a black ball; a bomb with
   a burning fuse is a countdown, and the whole scoring floor rests on the
   player recognising one on sight. */
const BOMB = {
  cxn: 0.4997, cyn: 0.618,     // ball centre, as a fraction of the canvas
  rn:  0.483,              // ball radius, as a fraction of canvas WIDTH
  tipx: 0.6894, tipy: 0.0418,   // fuse tip
  asp: 1.2714,              // canvas height / width
  ball: 0.46,                 // drawn ball radius, in units of DS
};

/* ============================ AUDIO ====================================== */
/* One AudioContext, built lazily on the first gesture. A mobile WebView has a
   single audio focus, and this game runs inside the board's iframe — building
   the context before the player has actually touched anything can interrupt
   the board's own music for nothing. */
const sfx = (() => {
  let ac = null, master = null, noise = null, muted = false, ready = false;
  function init(){
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ac = new AC(); } catch (e) { return null; }
    master = ac.createGain(); master.gain.value = 0.34; master.connect(ac.destination);
    const n = ac.sampleRate * 0.6; noise = ac.createBuffer(1, n, ac.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    return ac;
  }
  function ok(){ if (muted || sim || !ready || state === 'title') return null;
                 const c = init(); if (!c) return null;
                 if (c.state === 'suspended') c.resume(); return c; }
  function tone(f0, f1, t, dur, type, gain){
    const c = ok(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f0, c.currentTime + t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), c.currentTime + t + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime + t);
    g.gain.exponentialRampToValueAtTime(gain, c.currentTime + t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t + dur);
    o.connect(g); g.connect(master); o.start(c.currentTime + t); o.stop(c.currentTime + t + dur + 0.02);
  }
  function hiss(dur, f0, f1, gain, q){
    const c = ok(); if (!c) return;
    const s = c.createBufferSource(); s.buffer = noise;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q || 1.1;
    bp.frequency.setValueAtTime(f0, c.currentTime);
    bp.frequency.exponentialRampToValueAtTime(f1, c.currentTime + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(gain, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    s.connect(bp); bp.connect(g); g.connect(master); s.start(); s.stop(c.currentTime + dur + 0.02);
  }
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
  return {
    unlock(){ ready = true; init(); },
    get muted(){ return muted; },
    toggle(){ muted = !muted; if (muted && ac) master.gain.value = 0; else if (master) master.gain.value = 0.34; return muted; },
    slice(type, n){ hiss(0.11, 1200, 3400, 0.16, 1.4);
                    tone(SCALE[Math.min(7, n - 1 + (type % 3))], SCALE[Math.min(7, n - 1 + (type % 3))] * 1.5, 0, 0.10, 'triangle', 0.10); },
    chime(n){ for (let i = 0; i < Math.min(5, n); i++) tone(SCALE[Math.min(7, i + 2)], SCALE[Math.min(7, i + 2)], i * 0.055, 0.16, 'sine', 0.13); },
    boom(){ hiss(0.45, 900, 60, 0.42, 0.7); tone(150, 32, 0, 0.45, 'sine', 0.34); },
    tick(){ tone(1500, 1500, 0, 0.05, 'square', 0.05); },
    ui(){ tone(660, 990, 0, 0.10, 'triangle', 0.12); },
    win(){ [0, 2, 4, 7].forEach((s, i) => tone(SCALE[s], SCALE[s], i * 0.10, 0.32, 'triangle', 0.14)); },
    lose(){ tone(400, 180, 0, 0.5, 'sawtooth', 0.10); },
  };
})();

/* ============================ INPUT ====================================== */
function localPt(e){ return { x: e.clientX - rect.left, y: e.clientY - rect.top }; }

function overUI(e){
  const t = e.target;
  return !!(t && t.closest && t.closest('#hud, .card, .btn'));
}
stage.addEventListener('pointerdown', e => {
  sfx.unlock();
  /* preventDefault on pointerdown suppresses the follow-up click, which would
     make the pause and mute buttons dead. Leave anything over the UI alone. */
  if (overUI(e)) return;
  if (state !== 'play' || !e.isPrimary) return;
  e.preventDefault();
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  down = true; trail.length = 0; lastPt = null; ghost = null;
  const p = localPt(e); pushPoint(p.x, p.y, elapsed);
}, { passive: false });

stage.addEventListener('pointermove', e => {
  if (!down || state !== 'play') return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs){ const p = localPt(ev); pushPoint(p.x, p.y, elapsed); }
}, { passive: false });

function endStroke(){
  down = false; lastPt = null;
  /* Closing the stroke group only on a timer let a player who never lifts a
     finger chain every slice of a 60 s round into one group. It pays nothing
     now, but it would still have claimed "47 in one swipe". */
  flushSwipe();
}
stage.addEventListener('pointerup', endStroke);
stage.addEventListener('pointercancel', endStroke);
/* No window 'blur' pause: embedded, the board can take focus for its own
   reasons and a round that pauses itself mid-swipe reads as a freeze.
   visibilitychange is the reliable signal and it is the one that matters. */
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') doPause(); });

/* ============================ SCREENS ==================================== */
const el = id => document.getElementById(id);
const scrTitle = el('title'), scrPause = el('settings'), scrResult = el('result');
const scoreVal = el('scoreVal'), timeVal = el('timeVal'), streakVal = el('streakVal');

function paintGoals(){
  const t = EVERMORE.thresholds, r = EVERMORE.rewards;
  const cash = c => '$' + ((c | 0) / 100).toFixed(2);
  el('goals').innerHTML =
    ['high', 'med', 'low'].map((b, i) =>
      '<div class="goal g' + (3 - i) + '"><span class="medal">' + ['🥇', '🥈', '🥉'][i] + '</span>' +
      '<span class="sc">' + t[b].toLocaleString() + ' SCORE</span>' +
      '<span class="ar">→</span><span class="cash">' + cash(r[b]) + '</span></div>').join('');
}

function show(scr){
  [scrTitle, scrPause, scrResult].forEach(s => s.classList.toggle('on', s === scr));
}

function startRun(){
  srand((Date.now() ^ (performance.now() * 1000)) >>> 0);
  score = 0; timeLeft = ROUND; elapsed = 0;
  sliced = 0; missed = 0; bombs = 0; bestSwipe = 0;
  sweets.length = halves.length = parts.length = pops.length = 0;
  trail.length = 0; lastPt = null; down = false; ghost = null;
  spawnT = 0.35; shake = 0; freeze = 0; flashT = 0; goT = 0.9; lastBomb = 0; timePen = 0; timeHit = 0;
  streak = 0; bestStreak = 0; streakHit = 0; lastMult = 1; taughtTier = false;
  swipe = { n: 0, last: -9, x: 0, y: 0 }; banner = null;
  state = 'play';
  document.body.classList.add('playing');
  document.body.classList.remove('over', 'hurry');
  show(null);
  scoreVal.textContent = '0'; timeVal.textContent = ROUND;
  sfx.ui();
}

/* The gear is the pause button. The spec asks for a visible countdown and a
   pause control; one gear that stops the clock and holds the sound switch is
   both, and it is what the mockup shows. */
function doPause(){
  if (state !== 'play') return;
  state = 'pause'; down = false; trail.length = 0; lastPt = null;
  syncSound();
  show(scrPause);
}
function doResume(){
  if (state !== 'pause') return;
  state = 'play'; show(null); sfx.ui();
}
function syncSound(){ el('soundBtn').textContent = 'SOUND: ' + (sfx.muted ? 'OFF' : 'ON'); }

function endRun(){
  state = 'over'; overAt = 0; flushSwipe();
  down = false; trail.length = 0; lastPt = null;
  if (sim) return;
  document.body.classList.remove('playing', 'hurry');
  document.body.classList.add('over');
}

let sent = false;
function showResult(){
  const s = score | 0, b = EVERMORE.band(s);
  const won = b !== 'none';
  const h1 = el('resTitle');
  h1.textContent = won ? 'YOU WON!' : "TIME'S UP!";
  h1.classList.toggle('lose', !won);
  el('resSub').textContent = won
    ? (b === 'high' ? '🥇 GOLD — top slicer, the biggest prize!'
      : b === 'med' ? '🥈 SILVER — sharp work, one tier from the top.'
      : '🥉 BRONZE — nice slicing, you cleared the goal.')
    : 'You needed ' + EVERMORE.thresholds.low.toLocaleString() + ' to win cash. So close!';
  el('resScore').textContent = s.toLocaleString();
  el('resStreak').textContent = bestStreak;
  el('resCash').textContent = EVERMORE.cash(s);
  el('resCash').style.color = won ? '' : '#8f86c4';
  show(scrResult);
  won ? sfx.win() : sfx.lose();
}

scrTitle.addEventListener('pointerdown', e => { e.preventDefault(); sfx.unlock(); startRun(); }, { passive: false });
el('resumeBtn').addEventListener('click', doResume);
el('wGear').addEventListener('click', e => { e.stopPropagation(); sfx.unlock(); doPause(); });
el('soundBtn').addEventListener('click', e => { e.stopPropagation(); sfx.toggle(); syncSound(); sfx.ui(); });
el('homeBtn').addEventListener('click', () => {
  if (sent) return; sent = true;
  el('homeBtn').setAttribute('disabled', '');
  /* HOME is the only way back, and it fires exactly once. */
  if (!EVERMORE.home(score | 0)){
    sent = false; el('homeBtn').removeAttribute('disabled');
    state = 'title'; document.body.classList.remove('over');
    sweets.length = halves.length = parts.length = pops.length = 0;
    score = 0; elapsed = 0; spawnT = 0.6; show(scrTitle);
  }
});

/* ============================ ATTRACT MODE =============================== */
/* The title screen plays itself: sweets drift up and a ghost blade slices them.
   A playable ad has a few hundred milliseconds to teach its verb, and showing
   the swipe beats writing it down. */
function attract(dt){
  spawnT -= dt;
  if (spawnT <= 0 && sweets.length < 3){
    spawnT = rr(0.9, 1.5);
    const o = launch('sweet', true); o.delay = 0; o.gold = false; sweets.push(o);
  }
  if (ghost){
    ghost.t += dt;
    const u = Math.min(1, ghost.t / ghost.dur);
    const x = ghost.x0 + (ghost.x1 - ghost.x0) * u;
    const y = ghost.y0 + (ghost.y1 - ghost.y0) * u;
    pushPoint(x, y, elapsed);
    if (u >= 1){ ghost = null; lastPt = null; trail.length = 0; }
  } else {
    for (const o of sweets){
      if (o.dead || o.delay > 0) continue;
      if (o.vy > -GRAV * 0.22 && o.y < H * 0.62 && o.y > H * 0.18){
        const a = rr(-0.5, 0.5) + (rnd() < 0.5 ? 0 : Math.PI);
        const L = W * 0.62;
        ghost = { t: 0, dur: 0.24,
          x0: o.x - Math.cos(a) * L * 0.5, y0: o.y - Math.sin(a) * L * 0.5,
          x1: o.x + Math.cos(a) * L * 0.5, y1: o.y + Math.sin(a) * L * 0.5 };
        trail.length = 0; lastPt = null;
        break;
      }
    }
  }
}

/* ============================ UPDATE ===================================== */
function step(dt){
  if (state === 'play'){
    elapsed += dt;
    timeLeft = Math.max(0, ROUND - elapsed - timePen);
    spawnT -= dt;
    if (spawnT <= 0) spawnGroup();
    if (freeze > 0) freeze = Math.max(0, freeze - dt);
    if (swipe.n && elapsed - swipe.last > SWIPE_WIN) flushSwipe();
    if (timeLeft <= 0) endRun();
  } else if (state === 'title'){
    elapsed += dt;
    attract(dt);
  } else if (state === 'over'){
    elapsed += dt; overAt += dt;
    if (overAt > 0.85 && !scrResult.classList.contains('on')) showResult();
  }
  if (state === 'pause') return;

  /* objects */
  for (let i = sweets.length - 1; i >= 0; i--){
    const o = sweets[i];
    if (o.delay > 0){ o.delay -= dt; continue; }
    o.vy += GRAV * dt; o.x += o.vx * dt; o.y += o.vy * dt; o.rot += o.spin * dt;
    if (o.dead || o.y > H + DS * 1.4){
      if (!o.dead && o.kind === 'sweet' && state === 'play'){ missed++; breakStreak(); }
      sweets.splice(i, 1);
    }
  }
  for (let i = halves.length - 1; i >= 0; i--){
    const h = halves[i];
    h.vy += GRAV * dt; h.x += h.vx * dt; h.y += h.vy * dt; h.rot += h.spin * dt;
    h.spin *= (1 - dt * 0.5);
    if (h.y > H + DS * 1.6) halves.splice(i, 1);
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life += dt;
    if (p.slashX === undefined){
      p.vy += GRAV * 0.55 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= (1 - dt * 1.3);
    }
    if (p.life > p.max) parts.splice(i, 1);
  }
  for (let i = pops.length - 1; i >= 0; i--){
    pops[i].t += dt; if (pops[i].t > 0.85) pops.splice(i, 1);
  }
  if (banner){ banner.t += dt; if (banner.t > 1.15) banner = null; }
  if (shake > 0) shake = Math.max(0, shake - dt * 3.2);
  if (flashT > 0) flashT = Math.max(0, flashT - dt);
  if (timeHit > 0) timeHit = Math.max(0, timeHit - dt);
  if (streakHit > 0) streakHit = Math.max(0, streakHit - dt);
  if (goT > 0) goT = Math.max(0, goT - dt);

  /* trail ages out — the blade is the last 130 ms of the stroke, not the stroke */
  while (trail.length && elapsed - trail[0].t > 0.13) trail.shift();
  if (!down && !ghost && trail.length) trail.shift();
}

/* ============================ DRAW ======================================= */
/* Comfortaa ships no tabular figures, so every character goes in its own cell.
   Rebuilt only when the string changes, which is at most once a frame per
   widget and usually far less. */
function setDigits(el, str){
  if (el.dataset.v === str) return;
  el.dataset.v = str;
  let h = '';
  for (const c of str) h += '<i' + (c === ',' || c === '.' ? ' class="sep"' : '') + '>' + c + '</i>';
  el.innerHTML = h;
}
let lastSec = -1, lastScore = -1, lastStreakN = -1;
function syncHud(){
  const s = score | 0;
  if (s !== lastScore){ lastScore = s; setDigits(scoreVal, s.toLocaleString()); }
  const t = Math.ceil(timeLeft);
  if (t !== lastSec){
    lastSec = t; setDigits(timeVal, String(t));
    if (state === 'play' && t <= 5 && t > 0) sfx.tick();
  }
  if (streak !== lastStreakN){
    lastStreakN = streak;
    setDigits(streakVal, String(streak));
    const t = streakTier();
    streakVal.className = 'val' + (t ? ' t' + (t + 1) : '');
  }
  document.body.classList.toggle('hurry', state === 'play' && timeLeft <= 10);
  document.body.classList.toggle('timehit', timeHit > 0);
  document.body.classList.toggle('streakhit', streakHit > 0);
}

function sprite(name, x, y, k, rot, alpha){
  const f = ATLAS.frames[name];
  if (!f) return;
  const w = f[2] * k, h = f[3] * k;
  ctx.save();
  ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = alpha;
  ctx.drawImage(atlasImg, f[0], f[1], f[2], f[3], -w / 2, -h / 2, w, h);
  ctx.restore();
}

function ribbon(pts, wMax, fill){
  const n = pts.length; if (n < 2) return;
  const L = [], R = [];
  for (let i = 0; i < n; i++){
    const p = pts[i];
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b.x - a.x, dy = b.y - a.y;
    const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const t = i / (n - 1);
    const w = wMax * Math.pow(t, 0.75) * 0.5;
    L.push(p.x - dy * w, p.y + dx * w);
    R.push(p.x + dy * w, p.y - dx * w);
  }
  ctx.beginPath(); ctx.moveTo(L[0], L[1]);
  for (let i = 1; i < n; i++) ctx.lineTo(L[i * 2], L[i * 2 + 1]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(R[i * 2], R[i * 2 + 1]);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}

function draw(){
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0){
    const s = shake * shake * DS * 0.32;
    ctx.translate(rr(-s, s), rr(-s, s));
  }

  /* halves behind wholes so a fresh cut reads as one object splitting */
  for (const h of halves){
    const m = ATLAS.meta[h.type];
    sprite(m.name + '_' + h.side, h.x, h.y, h.k, h.rot, h.a);
  }

  for (const o of sweets){
    if (o.delay > 0) continue;
    if (o.kind === 'bomb'){
      const Sw = DS * BOMB.ball / BOMB.rn, Sh = Sw * BOMB.asp;
      ctx.save(); ctx.translate(o.x, o.y);
      /* a soft danger glow under the ball, drawn UNROTATED so it reads as a
         signal rather than part of the object */
      const pr = 0.5 + 0.5 * Math.sin(elapsed * 6.5 + o.born * 4);
      const gg = ctx.createRadialGradient(0, 0, DS * 0.34, 0, 0, DS * (0.72 + 0.10 * pr));
      gg.addColorStop(0, 'rgba(255,40,80,' + (0.30 + 0.22 * pr) + ')');
      gg.addColorStop(1, 'rgba(255,40,80,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(0, 0, DS * (0.72 + 0.10 * pr), 0, 7); ctx.fill();
      ctx.save(); ctx.rotate(o.rot * 0.20);
      ctx.drawImage(bombImg, -Sw * BOMB.cxn, -Sh * BOMB.cyn, Sw, Sh);
      /* live spark on the measured rope tip */
      const fx = (BOMB.tipx - BOMB.cxn) * Sw, fy = (BOMB.tipy - BOMB.cyn) * Sh;
      const fl = 0.70 + 0.30 * Math.sin(elapsed * 34 + o.born * 7);
      const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, DS * 0.26 * fl);
      g.addColorStop(0, 'rgba(255,255,235,1)'); g.addColorStop(0.22, 'rgba(255,225,120,.92)');
      g.addColorStop(0.50, 'rgba(255,150,40,.55)'); g.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, DS * 0.26 * fl, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(255,240,190,' + (0.55 * fl) + ')';
      ctx.lineWidth = DS * 0.020;
      for (let i = 0; i < 4; i++){
        const a = elapsed * 5 + i * Math.PI / 2 + o.born, L = DS * 0.17 * fl;
        ctx.beginPath();
        ctx.moveTo(fx + Math.cos(a) * L * 0.25, fy + Math.sin(a) * L * 0.25);
        ctx.lineTo(fx + Math.cos(a) * L, fy + Math.sin(a) * L);
        ctx.stroke();
      }
      ctx.restore();
      ctx.restore(); ctx.restore();
    } else {
      const m = ATLAS.meta[o.type];
      const k = DS / Math.sqrt(m.w * m.h);
      if (o.gold){
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, DS * 0.82);
        const pl = 0.55 + 0.45 * Math.sin(elapsed * 6 + o.born * 5);
        g.addColorStop(0, 'rgba(255,215,90,' + (0.42 * pl) + ')');
        g.addColorStop(1, 'rgba(255,180,40,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, DS * 0.82, 0, 7); ctx.fill();
        ctx.restore();
      }
      sprite(m.name + '_w', o.x, o.y, k, o.rot);
      if (o.gold){
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 3; i++){
          const a = elapsed * 2.2 + i * 2.1 + o.born;
          const rx = o.x + Math.cos(a) * DS * 0.46, ry = o.y + Math.sin(a * 1.3) * DS * 0.4;
          const s = DS * 0.055 * (0.6 + 0.4 * Math.sin(elapsed * 9 + i));
          ctx.fillStyle = 'rgba(255,240,170,.9)';
          ctx.beginPath();
          ctx.moveTo(rx, ry - s * 2.2); ctx.lineTo(rx + s * 0.6, ry - s * 0.6);
          ctx.lineTo(rx + s * 2.2, ry); ctx.lineTo(rx + s * 0.6, ry + s * 0.6);
          ctx.lineTo(rx, ry + s * 2.2); ctx.lineTo(rx - s * 0.6, ry + s * 0.6);
          ctx.lineTo(rx - s * 2.2, ry); ctx.lineTo(rx - s * 0.6, ry - s * 0.6);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
    }
  }

  /* particles */
  ctx.save();
  for (const p of parts){
    const u = p.life / p.max;
    if (p.slashX !== undefined){
      const L = DS * (0.7 + u * 1.5);
      ctx.globalAlpha = (1 - u) * 0.85;
      ctx.strokeStyle = '#fff'; ctx.lineWidth = DS * 0.055 * (1 - u); ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.slashX - p.ux * L, p.slashY - p.uy * L);
      ctx.lineTo(p.slashX + p.ux * L, p.slashY + p.uy * L);
      ctx.stroke();
      continue;
    }
    ctx.globalAlpha = 1 - u * u;
    ctx.fillStyle = p.col;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - u * 0.5), 0, 7); ctx.fill();
  }
  ctx.restore();

  /* blade */
  if (trail.length > 1 && freeze <= 0){
    const pts = trail;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ribbon(pts, BLADE_W * 2.6, 'rgba(255,90,180,.18)');
    ribbon(pts, BLADE_W * 1.45, 'rgba(255,175,225,.34)');
    ctx.globalCompositeOperation = 'source-over';
    ribbon(pts, BLADE_W * 0.60, ghost ? 'rgba(255,255,255,.72)' : 'rgba(255,255,255,.96)');
    ctx.restore();
  }

  /* score pops */
  for (const p of pops){
    const u = p.t / 0.85;
    ctx.save();
    ctx.globalAlpha = u < 0.12 ? u / 0.12 : 1 - Math.max(0, (u - 0.55) / 0.45);
    const s = DS * (p.small ? 0.20 : p.big ? 0.34 : 0.26) * (1 + (u < 0.15 ? (0.15 - u) * 2.4 : 0));
    ctx.font = '900 ' + s + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = s * 0.26; ctx.strokeStyle = 'rgba(28,14,66,.92)'; ctx.lineJoin = 'round';
    ctx.strokeText(p.txt, p.x, p.y - u * DS * 0.75);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, p.x, p.y - u * DS * 0.75);
    ctx.restore();
  }

  /* streak banner — a tier-up, or a stroke that took several at once */
  if (banner){
    const u = banner.t / 1.15;
    const isStreak = banner.kind === 'tier';
    const pop = u < 0.16 ? 1 + (0.16 - u) * 3.2 : 1;
    ctx.save();
    ctx.globalAlpha = 1 - Math.max(0, (u - 0.55) / 0.45);
    const s = DS * (isStreak ? 0.38 : 0.44);
    ctx.font = '900 ' + s + 'px ' + FONT;
    const head = isStreak ? 'STREAK \u00d7' + banner.mult : 'STREAK ' + banner.streak;
    const sub  = isStreak ? '' : banner.n + ' IN ONE SWIPE';
    /* Clamp on the MEASURED half-width of the WIDER line. A fixed fraction of W
       clipped the wide banners off the right edge at exactly the moment they
       mattered; measuring only the headline then let a long second line hang
       off both edges instead. */
    let half = ctx.measureText(head).width / 2;
    if (sub){
      ctx.font = '900 ' + (s * 0.62) + 'px ' + FONT;
      half = Math.max(half, ctx.measureText(sub).width / 2);
      ctx.font = '900 ' + s + 'px ' + FONT;
    }
    half += s * 0.22;
    ctx.translate(Math.max(half + 4, Math.min(W - half - 4, banner.x)),
                  Math.max(H * 0.17, Math.min(H * 0.74, banner.y - DS * 0.9)) - u * DS * 0.5);
    ctx.scale(pop, pop);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const g = ctx.createLinearGradient(0, -s * 0.6, 0, s * 0.6);
    if (isStreak){ g.addColorStop(0, '#dff6ff'); g.addColorStop(0.5, '#5fdcff'); g.addColorStop(1, '#2f7bff'); }
    else          { g.addColorStop(0, '#fff6b0'); g.addColorStop(0.5, '#ffd23c'); g.addColorStop(1, '#ff8a2e'); }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = s * 0.30; ctx.strokeStyle = 'rgba(28,14,66,.95)'; ctx.lineJoin = 'round';
    ctx.strokeText(head, 0, 0);
    ctx.fillStyle = g; ctx.fillText(head, 0, 0);
    if (sub){
      const s2 = s * 0.62;
      ctx.font = '900 ' + s2 + 'px ' + FONT;
      ctx.lineWidth = s2 * 0.30;
      ctx.strokeText(sub, 0, s * 0.86);
      ctx.fillStyle = '#ffffff'; ctx.fillText(sub, 0, s * 0.86);
    }
    ctx.restore();
  }

  ctx.restore();  /* shake */

  /* bomb flash */
  if (flashT > 0){
    ctx.save();
    ctx.globalAlpha = (flashT / 0.36) * 0.42;
    ctx.fillStyle = '#ff2a3c'; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* GO! / TIME! stingers */
  if (goT > 0 && state === 'play'){
    const u = 1 - goT / 0.9;
    ctx.save();
    ctx.globalAlpha = Math.min(1, (1 - u) * 2.2);
    ctx.translate(W / 2, H * 0.42); ctx.scale(1 + u * 0.7, 1 + u * 0.7);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const s = Math.min(W, H) * 0.20;
    ctx.font = '900 ' + s + 'px ' + FONT;
    ctx.lineWidth = s * 0.20; ctx.strokeStyle = 'rgba(28,14,66,.95)'; ctx.lineJoin = 'round';
    ctx.strokeText('SLICE!', 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillText('SLICE!', 0, 0);
    ctx.restore();
  }
  if (state === 'over' && overAt < 0.9){
    const u = Math.min(1, overAt / 0.9);
    ctx.save();
    ctx.globalAlpha = 1 - u * u;
    ctx.translate(W / 2, H * 0.42); ctx.scale(1 + u * 0.5, 1 + u * 0.5);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const s = Math.min(W, H) * 0.19;
    ctx.font = '900 ' + s + 'px ' + FONT;
    ctx.lineWidth = s * 0.20; ctx.strokeStyle = 'rgba(28,14,66,.95)'; ctx.lineJoin = 'round';
    ctx.strokeText("TIME'S UP", 0, 0);
    ctx.fillStyle = '#ffd23c'; ctx.fillText("TIME'S UP", 0, 0);
    ctx.restore();
  }
}
const FONT = 'Comfortaa, ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif';

/* ============================ LOOP ======================================= */
let prev = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!prev) prev = now;
  const dt = Math.min(0.034, (now - prev) / 1000);
  prev = now;
  step(dt);
  draw();
  syncHud();
}

function boot(){
  if (booted) return; booted = true;
  paintGoals();
  resize();
  srand((Date.now() ^ 0x5bf03635) >>> 0);
  spawnT = 0.5;
  el('load').classList.add('off');
  setTimeout(() => { const l = el('load'); if (l && l.parentNode) l.parentNode.removeChild(l); }, 500);
  requestAnimationFrame(frame);
}

/* ============================ THRESHOLD SIM ==============================
   Not shipped behaviour — this is the harness the three plaque numbers came
   out of, kept next to them so the next person can tell measurement from
   invention. It drives the REAL update loop and the REAL scoring at a fixed
   timestep with a synthetic player, so the numbers cannot drift away from the
   game the way a hand-written model would.

     window.__SIM__.run({skill:0.5}, seed)  -> {score, sliced, missed, bombs}
     window.__SIM__.run({masher:true, gap:.15, len:.40, spread:1}, seed)
     window.__SIM__.run({idle:true}, seed)

   ---- Threshold derivation ------------------------------------------------
   Population: 1,500 runs, stratified (not sampled) over a first-contact skill
   curve — this is a playable ad, the player has never seen the game and gets
   one 60 s round. 12% barely engage, 60% are ordinary first-timers, 22% pick
   it up fast, 6% are already good. Skill drives eight things at once:
   decision latency, aim error, lead error, stroke length, stroke rate,
   attention, bomb recognition, and whether they try to line two desserts up.

     skill band   median score   sliced   missed   bombs hit
       0.0-0.2        1145         37       33        2.2
       0.2-0.4        1741         49       20        2.7
       0.4-0.6        2796         60        7        3.3
       0.6-0.8        3914         67        1        3.3
       0.8-1.0        5793         73        0        2.5

   Monotone in skill across the whole range, which is the thing worth checking:
   a threshold set on a distribution that does not track skill is a lottery.

     high 4500  clears 10.7%   (brief: the top prize should be the top ~10%)
     med  2700  clears 32.5%
     low  1000  clears 83.1%   (brief: ~80-85%)

   FLOOR TEST — seven ways of not playing properly, 400 runs each:

     strategy                 median   p90    p95   worst run   % clearing 1000
     idle (never swipes)           0     0      0        0            0
     tap without dragging          0     0      0        0            0
     scribble, small strokes     159   751   1017     2412          5.3
     camp in one spot            190   765   1007     2115          5.3
     flail, fast + wide          223   834   1017     1874          5.8
     lazy blind sweeps           232   842   1086     1726          6.0
     slow blind sweeps           238   943   1147     2176          8.0
     flail at a human rate       244   857   1057     3301          6.0

   Pooled, 5.2% of bad-play runs clear the bronze goal against 83.1% of real
   players, and every strategy's 90th percentile lands below it. Tapping without
   dragging scores exactly nothing, because the blade needs real movement to cut.
   The honest caveat is the tail: the single best of 400 flail runs reached 3301,
   because a blind sweep does sometimes catch four desserts and sometimes draws
   a run with few bombs. No stochastic game can put its absolute maximum
   bad-play run under its floor.

   A CORRECTION worth keeping, because it was believed for a while: an earlier
   version of this note claimed no bad-play strategy ever got a streak past 5,
   and used that to argue the streak was invisible to mashing. It was wrong —
   the column being read was best-SWIPE, not best-streak, because __SIM__ was
   returning the wrong field. Measured properly, flailing bots reach streaks of
   12 to 28. What actually holds them down is the guaranteed bomb every
   BOMB_DUE seconds: it breaks the streak, and it costs points and clock. The
   separation is real, but it is the bombs doing the work, not the streak being
   unreachable.

   Three mechanics carry the floor and all three were measured into place:
     - the streak breaks on a bomb as well as on a drop, which is what stops a
       high-volume swiper from parking at the top tier;
     - a bomb costs CLOCK as well as points, because points alone ratchet — the
       score floors at zero, so once a masher bottoms out every later bomb is
       free while every slice still pays;
     - the tiers are x1 / x1.4 / x1.8 at 0 / 3 / 10. A multiplier compounds with
       an already skill-correlated slice count: the first draft ran to x4 and
       blew the 15th-to-90th percentile spread out to 9.1x. Landing the first
       tier after only three slices — so nearly every engaged player feels it —
       and capping at x1.8 brings it to 5.0x.
   ------------------------------------------------------------------------ */
window.__SIM__ = (function(){
  function run(bot, seed){
    sim = true;
    const keepState = state;
    W = bot.W || 430; H = bot.H || 880; layout();
    srand(seed >>> 0 || 1);
    score = 0; timeLeft = ROUND; elapsed = 0;
    sliced = missed = bombs = bestSwipe = 0; streak = bestStreak = 0;
    sweets.length = halves.length = parts.length = pops.length = 0;
    trail.length = 0; lastPt = null; spawnT = 0.35; freeze = 0; shake = 0; lastBomb = 0; timePen = 0;
    streak = 0; bestStreak = 0; streakHit = 0; lastMult = 1; taughtTier = false; taughtTier = false;
    swipe = { n: 0, last: -9, x: 0, y: 0 };
    state = 'play';

    const dt = 1 / 60;
    const s = bot.skill;
    const M = !!bot.masher;
    const react   = M ? 0        : 0.62 - 0.50 * s;   // s of decision latency
    const aimErr  = M ? 1.5      : 1.60 - 1.42 * s;   // lateral error, in radii, 1 sigma
    const timeErr = M ? 0        : 0.10 - 0.09 * s;   // s of lead error
    /* Even the weakest genuine player is LOOKING at the screen, and a black
       sphere with a lit fuse in a field of pastel desserts is not a subtle
       tell. Modelling a first-timer as bomb-blind made them worse than a bot
       that swipes at random, which is backwards: aiming is the thing that
       separates playing from flailing. */
    const seeBomb = M ? 0        : 0.35 + 0.60 * s;   // p(notice a bomb on the path)
    const gap     = bot.gap != null ? bot.gap : (M ? 0.10 : 0.80 - 0.65 * s);
    const strokeL = bot.len != null ? W * bot.len : (M ? W * 0.70 : W * (0.30 + 0.44 * s));
    const greed   = M ? 0        : 0.04 + 0.76 * s;   // p(line a stroke up on 2)
    const attend  = M ? 1        : 0.62 + 0.38 * s;   // p(act at all on a live target)
    const gauss   = () => (rnd() + rnd() + rnd() - 1.5) * 2;   // ~N(0,1)
    let cool = 0, stroke = null;

    while (state === 'play' && elapsed < ROUND * 3){
      cool -= dt;
      if (stroke){
        stroke.i++;
        const u = stroke.i / stroke.n;
        pushPoint(stroke.x0 + (stroke.x1 - stroke.x0) * u,
                  stroke.y0 + (stroke.y1 - stroke.y0) * u, elapsed);
        if (stroke.i >= stroke.n){ stroke = null; lastPt = null; trail.length = 0; flushSwipe(); }
      } else if (cool <= 0){
        stroke = plan();
        cool = stroke ? gap : 0.10;
      }
      step(dt);
    }
    const out = { score: score | 0, sliced, missed, bombs,
                  best: bestStreak, swipe: bestSwipe, played: Math.round(elapsed * 10) / 10 };
    state = keepState; sim = false;
    sweets.length = halves.length = parts.length = pops.length = 0;
    trail.length = 0; lastPt = null;
    return out;

    function plan(){
      if (bot.idle) return null;
      if (M){
        const sp = bot.spread == null ? 1 : bot.spread;
        const a = rnd() * Math.PI * 2;
        const cx = W * (0.5 + (rnd() - 0.5) * 0.6 * sp);
        const cy = H * (0.52 + (rnd() - 0.5) * 0.55 * sp);
        const L = strokeL;
        return seg(cx - Math.cos(a) * L / 2, cy - Math.sin(a) * L / 2,
                   cx + Math.cos(a) * L / 2, cy + Math.sin(a) * L / 2);
      }
      if (rnd() > attend) return null;
      /* pick the ripest sweet: on screen, has been visible longer than the
         bot's reaction time, and closest to falling out */
      let best = null, bestY = -1;
      for (const o of sweets){
        if (o.dead || o.delay > 0 || o.kind !== 'sweet') continue;
        if (elapsed - o.born < react) continue;
        if (o.y < -RAD || o.y > H + RAD) continue;
        if (o.y > bestY){ bestY = o.y; best = o; }
      }
      if (!best) return null;

      /* aim: through the target, with error, optionally lined up on a second */
      let ang = rnd() * Math.PI;
      let partner = null;
      if (rnd() < greed){
        for (const o of sweets){
          if (o === best || o.dead || o.delay > 0 || o.kind !== 'sweet') continue;
          if (o.y < -RAD || o.y > H + RAD) continue;
          const d = Math.hypot(o.x - best.x, o.y - best.y);
          if (d > RAD * 1.2 && d < W * 0.62){ partner = o; break; }
        }
      }
      if (partner) ang = Math.atan2(partner.y - best.y, partner.x - best.x);
      const off = gauss() * aimErr * RAD;
      const nx = -Math.sin(ang), ny = Math.cos(ang);
      /* lead the target by the stroke's own duration, badly if unskilled */
      const lead = 3 / 60 + gauss() * timeErr;
      const tx = best.x + best.vx * lead + nx * off;
      const ty = best.y + best.vy * lead + ny * off;
      const L = strokeL;
      const x0 = tx - Math.cos(ang) * L * 0.5, y0 = ty - Math.sin(ang) * L * 0.5;
      const x1 = tx + Math.cos(ang) * L * 0.5, y1 = ty + Math.sin(ang) * L * 0.5;
      /* would it clip a bomb? a skilled player usually sees it and holds */
      for (const o of sweets){
        if (o.kind !== 'bomb' || o.dead || o.delay > 0) continue;
        if (segDist(x0, y0, x1, y1, o.x, o.y) < RAD * 0.80 && rnd() < seeBomb) return null;
      }
      return seg(x0, y0, x1, y1);
    }
    function seg(x0, y0, x1, y1){ return { x0, y0, x1, y1, i: -1, n: 4 }; }
  }
  return { run };
})();
</script>
