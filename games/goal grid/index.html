<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#8ED081">
<title>GOAL GRID — Swipe the ball into the net</title>
<style>
  /* House style shared with Parking Jam Rush: bright daytime green, white
     rounded cards and pills, dark blue-grey ink, coral buttons with a hard
     bottom shadow, system sans. */
  :root{
    --ground:#8ED081; --ink:#2B3A4A; --ink-soft:#7A8A99; --ink-faint:#9AA7B4;
    --coral:#FF6B6B; --coral-dark:#D14D4D; --yellow:#FFD93D; --yellow-dark:#D9B21E;
    --green:#6BCB77; --green-dark:#4CA658; --blue:#4D96FF;
    --card-shadow:0 12px 40px rgba(0,0,0,.35);
    --sans:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ground);
    font-family:var(--sans);color:var(--ink);overscroll-behavior:none;touch-action:none;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .hide{display:none !important;}
  button{font-family:var(--sans);}

  #ui{position:fixed;inset:0;pointer-events:none;
      padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right))
              max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));}

  /* ---------- HUD: white pills, label over number ---------- */
  #hud{position:absolute;left:0;right:0;top:0;padding:inherit;display:flex;flex-direction:column;
       align-items:center;gap:8px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;justify-content:center;width:100%;}
  .pill{background:rgba(255,255,255,.92);border-radius:16px;padding:8px 14px 7px;min-width:96px;
        display:flex;flex-direction:column;gap:1px;color:var(--ink);white-space:nowrap;
        box-shadow:0 3px 0 rgba(0,0,0,.12);}
  .pill small{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);}
  .pill span{font-size:22px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;}
  .pill span b{color:var(--coral);font-weight:800;}
  .pill.name span{font-size:17px;padding-top:3px;}
  .pill .bar{height:6px;border-radius:3px;background:rgba(0,0,0,.15);margin-top:5px;overflow:hidden;}
  .pill .bar i{display:block;height:100%;width:100%;background:var(--green);border-radius:3px;transition:width .2s linear;}
  .pill.urgent{background:var(--coral);color:#fff;}
  .pill.urgent small{color:rgba(255,255,255,.85);}
  .pill.urgent .bar{background:rgba(0,0,0,.2);}
  .pill.urgent .bar i{background:#fff;}
  #full .stat{font-size:20px;font-weight:800;color:var(--ink);margin-top:6px;}
  #full .sub{margin:8px 0 4px;}
  #full .best{color:var(--ink-soft);font-size:14px;font-weight:700;margin-bottom:18px;min-height:18px;}
  #hint{max-width:min(92vw,400px);text-align:center;font-size:14px;font-weight:700;line-height:1.35;
        color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.18);padding:0 6px;}
  #hint:empty{display:none;}

  /* ---------- Bottom controls: white rounded buttons ---------- */
  #foot{position:absolute;left:0;right:0;bottom:0;padding:inherit;display:flex;justify-content:center;gap:10px;}
  .ctl{pointer-events:auto;width:64px;height:58px;border-radius:18px;border:none;cursor:pointer;
       background:rgba(255,255,255,.95);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18);
       font-size:22px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;
       gap:1px;transition:transform .06s,box-shadow .06s;}
  .ctl small{font-size:10px;letter-spacing:.6px;font-weight:800;text-transform:uppercase;color:var(--ink-soft);}
  .ctl:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .ctl:disabled{color:var(--ink-faint);background:rgba(255,255,255,.55);pointer-events:none;box-shadow:none;}
  .ctl.hot{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-dark);}
  .ctl.hot small{color:rgba(255,255,255,.85);}
  .ctl.hot:active{box-shadow:0 1px 0 var(--coral-dark);}

  /* ---------- Overlays: dim blur + white card ---------- */
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
           text-align:center;pointer-events:auto;padding:24px;
           background:rgba(30,42,54,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  .card{background:#fff;border-radius:24px;padding:30px 34px 32px;box-shadow:var(--card-shadow);
        max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;}
  .emoji{font-size:52px;line-height:1;margin-bottom:10px;}
  h1{font-size:34px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.05;text-wrap:balance;}
  h1 span{color:var(--coral);}
  .sub{color:var(--ink-soft);font-size:15px;line-height:1.45;margin:12px 0 22px;max-width:280px;text-wrap:balance;}
  .btn{pointer-events:auto;border:none;cursor:pointer;background:var(--coral);color:#fff;font-size:20px;font-weight:700;
       padding:16px 44px;border-radius:16px;box-shadow:0 5px 0 var(--coral-dark);transition:transform .06s,box-shadow .06s;}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-dark);}
  .btn.ghost{background:#fff;color:var(--ink);font-size:15px;padding:12px 26px;margin-top:12px;
             box-shadow:0 4px 0 rgba(0,0,0,.14);}
  .btn.ghost:active{box-shadow:0 1px 0 rgba(0,0,0,.14);}
  .keys{margin-top:16px;font-size:12px;color:var(--ink-faint);font-weight:600;}

  /* GOAL card */
  #win h1{font-size:44px;color:var(--ink);animation:pop .45s cubic-bezier(.2,1.6,.4,1);}
  #win h1 span{color:var(--green-dark);}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  .big-score{font-size:56px;font-weight:800;color:var(--ink);margin:4px 0 0;line-height:1;font-variant-numeric:tabular-nums;}
  .big-score em{font-style:normal;font-size:20px;color:var(--ink-soft);font-weight:700;}
  #stars{font-size:34px;letter-spacing:4px;margin:6px 0 2px;color:var(--yellow);text-shadow:0 2px 0 var(--yellow-dark);}
  #stars .dim{color:#E3E8EC;text-shadow:none;}
  #winBest{color:var(--ink-soft);font-size:14px;margin:6px 0 20px;}

  /* OUT toast: floating text with a dark stroke, like the lot's pop-ups */
  #out{position:absolute;left:0;right:0;top:42%;display:flex;justify-content:center;pointer-events:none;}
  #out div{color:#fff;font-size:clamp(30px,9vw,46px);font-weight:800;letter-spacing:-.5px;
           -webkit-text-stroke:2px rgba(0,0,0,.4);paint-order:stroke fill;
           text-shadow:0 4px 0 rgba(0,0,0,.18);transform:rotate(-3deg);
           animation:pop .35s cubic-bezier(.2,1.6,.4,1);}

  /* Level select */
  #levels .card{padding:26px 22px 24px;}
  #levels h1{font-size:26px;margin-bottom:16px;}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;}
  .lv{pointer-events:auto;aspect-ratio:1;border-radius:16px;border:none;cursor:pointer;
      background:#F1F4F6;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
      font-size:22px;font-weight:800;transition:transform .06s,box-shadow .06s;}
  .lv small{font-size:10px;font-weight:700;color:var(--ink-soft);letter-spacing:.3px;}
  .lv.done{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark);}
  .lv.done small{color:rgba(255,255,255,.9);}
  .lv.star{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-dark);}
  .lv.star small{color:rgba(43,58,74,.75);}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .lv.endless{grid-column:1 / -1;aspect-ratio:auto;padding:12px 16px;gap:2px;
              background:var(--blue);color:#fff;box-shadow:0 4px 0 #3572CF;font-size:20px;}
  .lv.endless small{color:rgba(255,255,255,.85);font-size:11px;}
  .lv.endless:active{box-shadow:0 1px 0 #3572CF;}
  .lv:focus-visible,.btn:focus-visible,.ctl:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){ #win h1,#out div{animation:none;} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="hud" class="hide">
    <div class="row">
      <div class="pill name"><small>Pitch</small><span id="lvPill">1 · Kick-off</span></div>
      <div class="pill"><small>Kicks</small><span id="movePill"><b>0</b> / 2</span></div>
      <div class="pill hide" id="cupPill"><small>Trophies</small><span><b>0</b>/1</span></div>
      <div class="pill hide" id="timePill"><small>Time</small><span id="timeVal">90s</span><div class="bar"><i id="timeBar"></i></div></div>
      <div class="pill hide" id="scorePill"><small>Score</small><span id="scoreVal">0</span></div>
    </div>
    <div id="hint"></div>
  </div>

  <div id="foot" class="hide">
    <button class="ctl" id="btnUndo" title="Undo (Z)">↶<small>Undo</small></button>
    <button class="ctl hot" id="btnRestart" title="Restart (R)">↻<small>Retry</small></button>
    <button class="ctl" id="btnLevels" title="Levels (Esc)">▦<small>Levels</small></button>
    <button class="ctl" id="btnMute" title="Sound">🔊<small>Sound</small></button>
  </div>

  <div id="out" class="hide"><div>OUT OF BOUNDS!</div></div>

  <div id="title" class="overlay">
    <div class="card">
      <div class="emoji">⚽</div>
      <h1>Goal <span>Grid</span></h1>
      <div class="sub">Swipe to kick. The ball rolls until something stops it. Find the front of the net.</div>
      <button class="btn" id="btnPlay">Play</button>
      <button class="btn ghost" id="btnTitleLevels">Pick a pitch</button>
      <div class="keys">Arrow keys work too · Z undo · R retry</div>
    </div>
  </div>

  <div id="levels" class="overlay hide">
    <div class="card">
      <h1>Pick a <span>pitch</span></h1>
      <div id="grid"></div>
      <button class="btn ghost" id="btnBack">Back</button>
    </div>
  </div>

  <div id="full" class="overlay hide">
    <div class="card">
      <h1>Full <span>time!</span></h1>
      <div class="big-score" id="fullBoards"></div>
      <div class="stat" id="fullScore"></div>
      <div class="sub" id="fullKicks"></div>
      <div id="fullBest" class="best"></div>
      <button class="btn" id="btnFullAgain">Play again</button>
      <button class="btn ghost" id="btnFullLevels">Levels</button>
    </div>
  </div>

  <div id="win" class="overlay hide">
    <div class="card">
      <h1>GOAL<span>!</span></h1>
      <div id="stars"></div>
      <div class="big-score" id="winStat"></div>
      <div id="winBest"></div>
      <button class="btn" id="btnNext">Next</button>
      <button class="btn ghost" id="btnAgain">New pitch</button>
    </div>
  </div>
</div>

<script>
window.GG = window.GG || {};
/* ===== config.js ===== */
(function(GG){
/* ===========================================================================
   GOAL GRID — config.js
   Timing and palette. Pure data, safe to load in node.
   ===========================================================================*/
var GG = (typeof GG !== 'undefined') ? GG : {};

GG.CFG = {
  MOVE_MS: 135,     // one tile, a normal kick
  SLIDE_MS: 70,     // one tile while skidding across wet grass
  BUMP_MS: 140,     // nudge into a cone and back
  PASS_MS: 460,     // lob between teammates
  OUT_MS: 560,      // roll off the edge and drop
  GOAL_MS: 1150,    // celebrate before the results card
  CRUMBLE_MS: 380,  // dry turf falling away
  SWIPE_MIN: 18,    // px before a drag counts as a swipe
  TILE_DEPTH: 0.08, // offset drop shadow under the pitch slab, as a fraction of tile size
  MAX_DPR: 2
};

/* Palette borrowed from Parking Jam Rush: flat fills paired with a darker
   outline, on a bright daytime green. [fill, outline] pairs throughout. */
GG.COLORS = {
  ground: '#8ED081',
  pitch: '#6BCB77', pitchAlt: '#63C070', pitchLine: '#4CA658', lines: 'rgba(255,255,255,.28)',
  goalTop: '#7FD68A', hole: '#3E7F47',
  ink: '#2B3A4A', inkSoft: '#7A8A99',
  shadow: 'rgba(0,0,0,.22)',
  crack: '#E9C46A', crackLine: '#C9A24A', crackMark: '#A9843A',
  mud: '#9C7150', mudLine: '#75513A', mudDark: '#7D5A3F',
  cone: '#FF9F45', coneLine: '#D97E2A', coneStripe: '#ffffff',
  board: '#FF6B6B', boardLine: '#D14D4D',
  gold: '#FFD93D', goldDark: '#D9B21E',
  jersey: '#4D96FF', jerseyLine: '#3572CF', jerseyAlt: '#FF8FAB', jerseyAltLine: '#D96C89', skin: '#F3C9A3',
  keeper: '#FFD93D', keeperLine: '#D9B21E', glove: '#ffffff',
  groups: { 1: '#B983FF', 2: '#FF8FAB', 3: '#2EC4B6' },
  groupsLine: { 1: '#9463D9', 2: '#D96C89', 3: '#1E9E92' },
  matTop: '#2EC4B6', matLine: '#1E9E92',
  ballLine: '#9AA7B4', panel: '#2B3A4A',
  net: 'rgba(43,58,74,.35)', post: '#ffffff', postLine: '#C9D3DC'
};

/* localStorage throws in sandboxed viewers (file previews, some file:// and
   private contexts). One unguarded call used to abort the whole game
   constructor, leaving a title screen whose Play button did nothing. */
GG.store = {
  mem: {},
  get: function (k) {
    try { var v = window.localStorage.getItem(k); if (v !== null) return v; } catch (e) {}
    return this.mem[k] === undefined ? null : this.mem[k];
  },
  set: function (k, v) {
    this.mem[k] = v;
    try { window.localStorage.setItem(k, v); } catch (e) {}
  }
};

if (typeof module !== 'undefined' && module.exports) module.exports = GG;

})(window.GG);

/* ===== engine.js ===== */
(function(GG){
/* ===========================================================================
   GOAL GRID — engine.js
   Pure rules. No DOM, no canvas, so it loads in node for the test suite and
   the solver. Everything the renderer needs to animate comes back as a list
   of events from step().

   THE RULE: a kicked ball rolls until something stops it. Roll off the pitch
   and it is out of bounds. So every level is about what you can stop against.

   Map legend (one char per tile):
     .  out of bounds (the drop)      #  grass
     S  kick-off spot (start)         G  goal (enter from its open side only)
     ^  cone      =  advertising board     both block the ball, costing no move
     M  mud: the ball stops dead when it lands here
     *  trophy: collect by rolling over it. The keeper stays in the net
        until every trophy on the pitch is collected.
     X  dry turf: crumbles once you roll OFF it (crossing it counts)
     @  teammate: the ball stops here and gets passed to the other @
     1 2 3  whistles: toggle mat group 1/2/3 every time the ball rolls over
     a b c  turf mats of group 1/2/3, closed until toggled
     A B C  turf mats of group 1/2/3, open until toggled
   ===========================================================================*/
var GG = (typeof GG !== 'undefined') ? GG : {};

GG.DIRS = {
  up:    { dr: -1, dc: 0 },
  down:  { dr:  1, dc: 0 },
  left:  { dr:  0, dc: -1 },
  right: { dr:  0, dc: 1 }
};
GG.DIR_NAMES = ['up', 'down', 'left', 'right'];
GG.STOPS = { M: true, '@': true, G: true };
GG.BLOCKERS = { '^': true, '=': true };

GG.key = function (r, c) { return r + ',' + c; };

GG.parseLevel = function (def, index) {
  var rows = def.map.length, cols = 0, r, c;
  for (r = 0; r < rows; r++) cols = Math.max(cols, def.map[r].length);

  var lv = {
    index: index || 0,
    name: def.name || ('Level ' + ((index || 0) + 1)),
    hint: def.hint || '',
    goalDir: def.goal || 'up',
    rows: rows, cols: cols,
    cells: [], start: null, goal: null, pass: [], switches: [], cups: [], groups: {}
  };

  for (r = 0; r < rows; r++) {
    lv.cells.push([]);
    for (c = 0; c < cols; c++) {
      var ch = def.map[r][c] || '.';
      if (ch === ' ') ch = '.';
      lv.cells[r].push(ch);
      if (ch === 'S') lv.start = { r: r, c: c };
      else if (ch === 'G') lv.goal = { r: r, c: c };
      else if (ch === '@') lv.pass.push({ r: r, c: c });
      else if (ch === '*') lv.cups.push({ r: r, c: c });
      else if (ch >= '1' && ch <= '3') { lv.switches.push({ r: r, c: c, group: +ch }); lv.groups[+ch] = true; }
      else if (/[a-cA-C]/.test(ch)) lv.groups[ch.toLowerCase().charCodeAt(0) - 96] = true;
    }
  }
  if (!lv.start) throw new Error('level "' + lv.name + '" has no S');
  if (!lv.goal) throw new Error('level "' + lv.name + '" has no G');
  if (lv.pass.length !== 0 && lv.pass.length !== 2) {
    throw new Error('level "' + lv.name + '" needs exactly two @ tiles, has ' + lv.pass.length);
  }
  return lv;
};

GG.tileAt = function (lv, r, c) {
  if (r < 0 || c < 0 || r >= lv.rows || c >= lv.cols) return '.';
  return lv.cells[r][c];
};

GG.bridgeGroup = function (ch) {
  return /[a-cA-C]/.test(ch) ? ch.toLowerCase().charCodeAt(0) - 96 : 0;
};

GG.initState = function (lv) {
  return { r: lv.start.r, c: lv.start.c, broken: {}, toggled: {}, cups: {}, moves: 0, status: 'play' };
};

GG.cloneState = function (s) {
  var b = {}, t = {}, u = {}, k;
  for (k in s.broken) b[k] = true;
  for (k in s.toggled) t[k] = s.toggled[k];
  for (k in s.cups) u[k] = true;
  return { r: s.r, c: s.c, broken: b, toggled: t, cups: u, moves: s.moves, status: s.status };
};

GG.cupsLeft = function (lv, s) {
  var n = 0;
  for (var i = 0; i < lv.cups.length; i++) if (!s.cups[GG.key(lv.cups[i].r, lv.cups[i].c)]) n++;
  return n;
};

/* Can the ball roll onto this tile right now? (false = it drops) */
GG.isOpen = function (lv, s, r, c) {
  var ch = GG.tileAt(lv, r, c);
  if (ch === '.' || GG.BLOCKERS[ch]) return false;
  if (ch === 'X') return !s.broken[GG.key(r, c)];
  var g = GG.bridgeGroup(ch);
  if (g) {
    var normallyOpen = ch === ch.toUpperCase();
    return normallyOpen !== !!s.toggled[g];
  }
  return true;
};

/* Something solid stands in the way: the ball stops in front of it. */
GG.isBlocked = function (lv, s, r, c, dir) {
  var ch = GG.tileAt(lv, r, c);
  if (GG.BLOCKERS[ch]) return true;
  if (ch === 'G') return dir !== lv.goalDir || GG.cupsLeft(lv, s) > 0;
  return false;
};

GG.step = function (lv, state, dir) {
  var d = GG.DIRS[dir];
  var ev = [];
  if (!d || state.status !== 'play') return { state: state, events: ev };

  var nr = state.r + d.dr, nc = state.c + d.dc;
  if (GG.isBlocked(lv, state, nr, nc, dir)) {
    ev.push({ type: 'blocked', r: nr, c: nc, dir: dir });
    return { state: state, events: ev };
  }

  var s = GG.cloneState(state);
  s.moves++;

  for (;;) {
    /* Leaving a tile. Dry turf gives way behind the ball. */
    if (GG.tileAt(lv, s.r, s.c) === 'X') {
      s.broken[GG.key(s.r, s.c)] = true;
      ev.push({ type: 'break', r: s.r, c: s.c });
    }
    if (!GG.isOpen(lv, s, nr, nc)) {
      s.r = nr; s.c = nc; s.status = 'out';
      ev.push({ type: 'out', r: nr, c: nc, dir: dir });
      return { state: s, events: ev };
    }
    s.r = nr; s.c = nc;
    ev.push({ type: 'move', r: nr, c: nc, dir: dir });

    /* Things that happen as the ball rolls over a tile. */
    var ch = GG.tileAt(lv, nr, nc);
    if (ch === '*' && !s.cups[GG.key(nr, nc)]) {
      s.cups[GG.key(nr, nc)] = true;
      ev.push({ type: 'collect', r: nr, c: nc, left: GG.cupsLeft(lv, s) });
    } else if (ch >= '1' && ch <= '3') {
      var g = +ch;
      s.toggled[g] = !s.toggled[g];
      ev.push({ type: 'switch', r: nr, c: nc, group: g, on: s.toggled[g] });
    }
    if (GG.STOPS[ch]) break;

    var rr = nr + d.dr, cc = nc + d.dc;
    if (GG.isBlocked(lv, s, rr, cc, dir)) { ev.push({ type: 'stop', r: rr, c: cc, dir: dir }); break; }
    nr = rr; nc = cc;
  }

  /* Where it came to rest. */
  var here = GG.tileAt(lv, s.r, s.c);
  if (here === 'G') {
    s.status = 'goal';
    ev.push({ type: 'goal', r: s.r, c: s.c });
  } else if (here === '@') {
    var other = (lv.pass[0].r === s.r && lv.pass[0].c === s.c) ? lv.pass[1] : lv.pass[0];
    ev.push({ type: 'pass', fromR: s.r, fromC: s.c, r: other.r, c: other.c });
    s.r = other.r; s.c = other.c;
  }
  return { state: s, events: ev };
};

/* --- Solver -----------------------------------------------------------------
   Breadth-first over (position, broken turf, whistle states, trophies).
   Returns the shortest solution AND how many different shortest solutions
   exist, so a level can be required to have exactly one. */
GG.stateKey = function (s) {

  var p = this.rend.centre(this.state.r, this.state.c);
  var b = this.ball;
  b.x = p.x; b.y = p.y; b.z = 0; b.scale = 1; b.alpha = 1; b.drop = 0; b.visible = true;
};

GG.Game.prototype._resize = function () {
  this.rend.resize();
  if (this.level) {
    var res = this.ui.reserved();
    this.rend.layout(this.level, res.top, res.bottom);
    if (!this.cur && !this.timeline.length) this._snapBall();
  }
};

GG.Game.prototype._save = function () {
  GG.store.set('goalgrid.progress.v2', JSON.stringify(this.progress));
};

GG.Game.prototype.restart = function () {
  if (this.mode !== 'PLAY') return;
  this._loadLevel(this.level);
  this.audio.click(false);
};

GG.Game.prototype.undo = function () {
  if (this.mode !== 'PLAY' || this.cur || this.timeline.length || !this.history.length) return;
  this.state = this.history.pop();
  this._rebuildView();
  this.ui.setHud(this.level, this.state.moves, this.level.par, this.endless && this.endless.board);
  this.ui.setUndo(this.history.length > 0);
  this.audio.click(false);
};

/* --- input ------------------------------------------------------------------ */
GG.Game.prototype._bindInput = function () {
  var self = this, start = null;
  var cv = this.canvas;
  cv.addEventListener('pointerdown', function (e) {
    self.audio.unlock();
    start = { x: e.clientX, y: e.clientY, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener('pointerup', function (e) {
    if (!start || start.id !== e.pointerId) return;
    var dx = e.clientX - start.x, dy = e.clientY - start.y;
    start = null;
    var dist = Math.abs(dx) + Math.abs(dy);
    if (dist < GG.CFG.SWIPE_MIN) {
      /* A tap kicks the ball toward the tap. */
      dx = e.clientX - self.ball.x; dy = e.clientY - self.ball.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < self.rend.t * 0.55) return;
    }
    self.move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  cv.addEventListener('pointercancel', function () { start = null; });

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
                w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
    if (map[k]) { e.preventDefault(); self.audio.unlock(); self.move(map[k]); return; }
    if (k === 'r' || k === 'R') self.restart();
    else if (k === 'z' || k === 'Z' || k === 'u' || k === 'U') self.undo();
    else if (k === 'Escape' && self.mode === 'PLAY') self.levelSelect();
    else if ((k === 'Enter' || k === ' ') && self.mode === 'TITLE') { self.audio.unlock(); self.play(self.progress.last || 0); }
  });
};

/* --- a move ----------------------------------------------------------------- */
GG.Game.prototype.move = function (dir) {
  if (this.mode !== 'PLAY' || this.state.status !== 'play') return;
  if (this.cur || this.timeline.length) { this.buffered = dir; return; }

  var res = GG.step(this.level, this.state, dir);
  if (res.state === this.state) {
    this.timeline.push({ kind: 'bump', dir: dir, dur: GG.CFG.BUMP_MS });
    return;
  }
  this.history.push(this.state);
  this.state = res.state;
  this.ui.setHud(this.level, this.state.moves, this.level.par, this.endless && this.endless.board);
  this.ui.setUndo(true);

  var self = this, tl = this.timeline, C = GG.CFG;
  var prev = this.rend.centre(this.history[this.history.length - 1].r, this.history[this.history.length - 1].c);
  var pendingBreak = null, first = true;
  res.events.forEach(function (e) {
    var to;
    switch (e.type) {
      case 'break':
        pendingBreak = { kind: 'break', r: e.r, c: e.c };
        break;
      case 'move':
        to = self.rend.centre(e.r, e.c);
        tl.push({ kind: 'roll', from: prev, to: to, dur: first ? C.MOVE_MS : C.SLIDE_MS, slide: !first, dir: dir });
        prev = to; first = false;
        if (pendingBreak) { tl.push(pendingBreak); pendingBreak = null; }
        break;
      case 'stop':
        tl.push({ kind: 'bump', dir: dir, dur: C.BUMP_MS * 0.7, quiet: true });
        break;
      case 'out':
        to = self.rend.centre(e.r, e.c);
        tl.push({ kind: 'out', from: prev, to: to, dur: C.OUT_MS, first: first });
        if (pendingBreak) { tl.push(pendingBreak); pendingBreak = null; }
        tl.push({ kind: 'fn', f: function () { self.ui.showOut(true); } });
        tl.push({ kind: 'wait', dur: 950 });
        tl.push({ kind: 'fn', f: function () { self._loadLevel(self.level); } });
        break;
      case 'switch':
        tl.push({ kind: 'switch', r: e.r, c: e.c, group: e.group, on: e.on });
        break;
      case 'collect':
        tl.push({ kind: 'collect', r: e.r, c: e.c, left: e.left });
        break;
      case 'pass':
        to = self.rend.centre(e.r, e.c);
        tl.push({ kind: 'pass', from: prev, to: to, dur: C.PASS_MS });
        prev = to;
        break;
      case 'goal':
        var d = GG.DIRS[self.level.goalDir];
        to = { x: prev.x + d.dc * self.rend.t * 0.22, y: prev.y + d.dr * self.rend.t * 0.22 };
        tl.push({ kind: 'roll', from: prev, to: to, dur: C.MOVE_MS * 0.6, slide: true, dir: dir });
        tl.push({ kind: 'goal', r: e.r, c: e.c });
        if (self.endless) {
          tl.push({ kind: 'wait', dur: 650 });
          tl.push({ kind: 'fn', f: function () { self._boardDone(); } });
        } else {
          tl.push({ kind: 'wait', dur: C.GOAL_MS });
          tl.push({ kind: 'fn', f: function () { self._win(); } });
        }
        break;
    }
  });
};

GG.Game.prototype._win = function () {
  var moves = this.state.moves, i = this.levelIndex, par = this.level.par;
  /* Pitches change every session, so progress is stars, not a move count. */
  var stars = moves <= par ? 3 : moves <= par * 1.5 ? 2 : 1;
  var best = this.progress.best[i] || 0;
  if (stars > best) this.progress.best[i] = stars;
  this._save();
  this.mode = 'WIN';
  this.ui.showWin(moves, par, stars, i === this.defs.length - 1);
};

/* --- timeline --------------------------------------------------------------- */
GG.Game.prototype._update = function (dt, now) {
  var b = this.ball, t = this.rend.t;
  if (this.endless && this.mode === 'PLAY' && this.state.status === 'play') {
    this.endless.timeLeft -= dt;
    this.ui.setTime(this.endless.timeLeft, GG.ENDLESS.seconds);
    if (this.endless.timeLeft <= 0) { this._fullTime(); return; }
  }
  if (!this.cur) {
    if (!this.timeline.length) {
      if (this.buffered) { var d = this.buffered; this.buffered = null; this.move(d); }
      return;
    }
    this.cur = this.timeline.shift();
    this.cur.elapsed = 0;
    this._start(this.cur, now);
    /* An instant action may have reset the level (out of bounds), which
       empties the timeline and clears cur under us. Stop here if so. */
    if (!this.cur) return;
  }
  var a = this.cur;
  if (a.dur === undefined) { this.cur = null; return this._update(dt, now); }
  a.elapsed += dt * 1000;
  var p = Math.min(1, a.elapsed / a.dur);
  switch (a.kind) {
    case 'roll': {
      var nx = a.from.x + (a.to.x - a.from.x) * p, ny = a.from.y + (a.to.y - a.from.y) * p;
      b.rx += nx - b.x; b.ry += ny - b.y; b.x = nx; b.y = ny;
      break;
    }
    case 'bump': {
      var dd = GG.DIRS[a.dir], k = Math.sin(Math.PI * p) * t * 0.16;
      b.x = a.base.x + dd.dc * k; b.y = a.base.y + dd.dr * k;
      break;
    }
    case 'pass': {
      var e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      b.x = a.from.x + (a.to.x - a.from.x) * e; b.y = a.from.y + (a.to.y - a.from.y) * e;
      b.z = Math.sin(Math.PI * p) * 1.4; b.rx += t * dt * 6;
      break;
    }
    case 'out': {
      var q = Math.min(1, p / 0.42);
      var ox = a.from.x + (a.to.x - a.from.x) * q, oy = a.from.y + (a.to.y - a.from.y) * q;
      b.rx += ox - b.x; b.ry += oy - b.y; b.x = ox; b.y = oy;
      if (p > 0.42) {
        var f = (p - 0.42) / 0.58;
        b.drop = f * f * t * 2.2; b.alpha = 1 - f; b.scale = 1 - f * 0.45;
        if (!a.whistled) { a.whistled = true; this.audio.out(); }
      }
      break;
    }
  }
  if (p >= 1) {
    if (a.kind === 'bump') { b.x = a.base.x; b.y = a.base.y; }
    if (a.kind === 'pass') b.z = 0;
    if (a.kind === 'out') b.visible = false;
    this.cur = null;
  }
};

GG.Game.prototype._start = function (a, now) {
  var b = this.ball, r = this.rend;
  switch (a.kind) {
    case 'roll': if (!a.slide) this.audio.kick(); break;
    case 'bump': a.base = { x: b.x, y: b.y }; if (!a.quiet) this.audio.bump(); break;
    case 'pass': this.audio.pass(); break;
    case 'out': if (a.first) this.audio.kick(); break;
    case 'break': {
      this.view.broken[GG.key(a.r, a.c)] = now;
      var c = r.centre(a.r, a.c);
      r.dust(c.x, c.y, 14, GG.COLORS.crackLine);
      this.audio.crumble();
      break;
    }
    case 'switch': {
      this.view.toggled[a.group] = a.on;
      var s = r.centre(a.r, a.c);
      r.pulse(s.x, s.y, GG.COLORS.groups[a.group]);
      this.audio.click(a.on);
      break;
    }
    case 'collect': {
      this.view.cups[GG.key(a.r, a.c)] = true;
      var cc = r.centre(a.r, a.c);
      r.pulse(cc.x, cc.y, GG.COLORS.gold);
      r.dust(cc.x, cc.y, 10, GG.COLORS.gold);
      this.ui.setCups(this.level.cups.length - a.left, this.level.cups.length);
      this.audio.collect(a.left === 0);
      break;
    }
    case 'goal': {
      this.view.goalFlash = now;
      var g = r.centre(a.r, a.c);
      r.confetti(g.x, g.y, 90);
      this.audio.goal();
      break;
    }
    case 'fn': a.f(); break;
  }
};

if (typeof module !== 'undefined' && module.exports) module.exports = GG;

})(window.GG);

</script>
<script>
  window.addEventListener('load', function () {
    try {
      window.GG.game = new GG.Game(document.getElementById('c'));
    } catch (err) {
      var tag = document.querySelector('#title .tag');
      if (tag) tag.textContent = 'Could not start: ' + (err && err.message ? err.message : err);
      throw err;
    }
  });
</script>
