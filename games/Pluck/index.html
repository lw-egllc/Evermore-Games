<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b0f2e">
<title>PLUCK — Evermore Arcade</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#1b0f2e;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
  }
  #c{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}

<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================================
   PLUCK  —  Evermore Arcade
   Hold to ripen. Release before it bursts. Sixty seconds, always.
   ========================================================================== */

/* ----------------------------------------------------------------------------
   1. TUNING
   -------------------------------------------------------------------------- */
const VW = 720, VH = 1280;              // virtual design resolution (portrait)

const RUN_TIME     = 60.0;              // every run is exactly this long
const OVERTIME_AT  = 10.0;              // seconds remaining when OVERTIME fires
const OVERTIME_MUL = 2;                 // value multiplier during overtime

const FOG_END      = 4.00;              // absolute latest a stem can hold
const SAFE_EARLY   = 1.20;              // guaranteed-safe hold at run start
const SAFE_LATE    = 0.70;              // guaranteed-safe hold at run end
const BURST_SKEW   = 1.60;              // >1 biases burst points early (risky)

const VAL_BASE     = 20;                // value at t = 0
const VAL_DOUBLE   = 0.45;              // seconds for value to double

const REGROW_PLUCK = 0.55;              // downtime after a successful pluck
const REGROW_BURST = 0.80;              // downtime after a burst

const CHAIN_CAP    = 10;                // chain ceiling (lifted in overtime)
const GREEN_CAP    = 3;                 // a pluck inside the green can only take
                                        // the chain this high. Past ×3 the fog is
                                        // the ONLY way up — this is what stops
                                        // risk-free play from dominating the run.
const CLUTCH_WIN   = 0.10;              // release this close to burst = CLUTCH
const CLUTCH_MUL   = 1.5;

const GRAV         = 2100;              // px/s^2 for free bodies
const GROUND       = 1108;              // shards land here
const ANCHOR       = { x: 358, y: 302 };
const STEM_LEN     = 268;
const STEM_NODES   = 14;

const GEM_R0       = 52;                // radius at t = 0
const GEM_RK       = 20.5;              // radius growth per second

const SAVE_KEY = "evermore.pluck.v1";

/* ----------------------------------------------------------------------------
   2. PALETTE
   -------------------------------------------------------------------------- */
const INK   = "#1b0f2e";
const CREAM = "#FFF3DC";
const GOLD  = "#FFD166";

const SKY = [
  [0.00, "#241553"],
  [0.30, "#4d2b85"],
  [0.52, "#8b4098"],
  [0.70, "#cf5f8c"],
  [0.84, "#f28d5f"],
  [1.00, "#ffd08a"],
];
const HILL_FAR  = "#7B4FA6", HILL_FAR_TOP  = "#A46FC4", HILL_FAR_RIM  = "#FFB27A";
const HILL_MID  = "#4E2B7A", HILL_MID_TOP  = "#6E43A0", HILL_MID_RIM  = "#FF9A6B";
const HILL_NEAR = "#2A1747", HILL_NEAR_TOP = "#432663", HILL_NEAR_RIM = "#B4649B";
const BARK      = "#5A3520", BARK_LIT      = "#82502F";
const LEAF      = "#2F9A5E", LEAF_LIT      = "#59CE88", LEAF_DARK = "#1D6540";

// ripeness ramp: green -> lime -> gold -> orange -> red -> hot pink
const RIPE = [
  [0.00, "#57D67C"],
  [0.85, "#B9E04C"],
  [1.55, "#FFC93C"],
  [2.35, "#FF8A3C"],
  [3.15, "#FF4757"],
  [4.00, "#FF2D8F"],
];

/* ----------------------------------------------------------------------------
   3. SMALL UTILITIES
   -------------------------------------------------------------------------- */
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp  = (a,b,t) => a + (b-a)*t;
const rand  = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const TAU   = Math.PI*2;
const easeOutCubic = t => 1 - Math.pow(1-t, 3);
const easeOutBack  = t => { const c=1.9; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };

function hexToRgb(h){
  const n = parseInt(h.slice(1),16);
  return [ (n>>16)&255, (n>>8)&255, n&255 ];
}
function rgbToHex(r,g,b){
  return "#" + ((1<<24) | (clamp(r|0,0,255)<<16) | (clamp(g|0,0,255)<<8) | clamp(b|0,0,255)).toString(16).slice(1);
}
function mixHex(a,b,t){
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0],B[0],t), lerp(A[1],B[1],t), lerp(A[2],B[2],t));
}
/** amount > 0 lightens toward white, < 0 darkens toward near-black */
function shade(hex, amount){
  return amount >= 0 ? mixHex(hex, "#ffffff", amount) : mixHex(hex, "#12081f", -amount);
}
/** pull a colour off a [pos, hex] ramp */
function ramp(stops, v){
  if (v <= stops[0][0]) return stops[0][1];
  for (let i=1;i<stops.length;i++){
    if (v <= stops[i][0]){
      const t = (v - stops[i-1][0]) / (stops[i][0] - stops[i-1][0]);
      return mixHex(stops[i-1][1], stops[i][1], t);
    }
  }
  return stops[stops.length-1][1];
}
function fmt(n){ return Math.round(n).toLocaleString("en-US"); }

// cheap deterministic value-noise, used for wind + hill silhouettes
function hash1(i){ const s = Math.sin(i*127.1)*43758.5453; return s - Math.floor(s); }
function noise1(x){
  const i = Math.floor(x), f = x - i;
  const u = f*f*(3-2*f);
  return lerp(hash1(i), hash1(i+1), u)*2 - 1;
}
function fbm(x){ return noise1(x)*0.55 + noise1(x*2.13+9.1)*0.28 + noise1(x*4.31+21.7)*0.17; }

/* ----------------------------------------------------------------------------
   4. CANVAS + VIEW
   -------------------------------------------------------------------------- */
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d", { alpha:false });
let dpr = 1, scale = 1, ox = 0, oy = 0;
const view = { x0:0, y0:0, x1:VW, y1:VH };
let bgCanvas = null, bgKey = "";

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = window.innerWidth, h = window.innerHeight;
  cvs.width  = Math.max(1, Math.floor(w*dpr));
  cvs.height = Math.max(1, Math.floor(h*dpr));
  cvs.style.width  = w + "px";
  cvs.style.height = h + "px";
  scale = Math.min(w/VW, h/VH);
  ox = (w - VW*scale)/2;
  oy = (h - VH*scale)/2;
  view.x0 = -ox/scale;  view.x1 = (w - ox)/scale;
  view.y0 = -oy/scale;  view.y1 = (h - oy)/scale;
  bgKey = ""; // force background re-bake
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 60));

/* ----------------------------------------------------------------------------
   5. DRAW HELPERS  (chunky cel look: flat fills, hard bands, fat ink lines)
   -------------------------------------------------------------------------- */
function inkStroke(w, g){
  g = g || ctx;
  g.strokeStyle = INK;
  g.lineWidth = w;
  g.lineJoin = "round";
  g.lineCap = "round";
  g.stroke();
}
function roundRect(x,y,w,h,r,g){
  g = g || ctx;
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
/** add a full circle as its own sub-path (so nonzero-fill unions overlaps) */
function subCircle(g,x,y,r){ g.moveTo(x+r,y); g.arc(x,y,r,0,TAU); }

/** chunky arcade text with an ink outline */
function celText(str, x, y, size, fill, {align="center", baseline="middle", outline=INK, ow=null, shadow=0} = {}){
  ctx.save();
  ctx.font = `900 ${size}px "Arial Black","Arial Bold",Impact,system-ui,sans-serif`;
  ctx.textAlign = align;
  ctx.textBaseline = baseline;
  ctx.lineJoin = "round";
  ctx.miterLimit = 2;
  if (shadow){
    ctx.fillStyle = "rgba(20,8,36,0.42)";
    ctx.fillText(str, x, y + shadow);
  }
  ctx.lineWidth = ow == null ? Math.max(4, size*0.20) : ow;
  if (ctx.lineWidth > 0){ ctx.strokeStyle = outline; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill;
  ctx.fillText(str, x, y);
  ctx.restore();
}
function textWidth(str, size){
  ctx.save();
  ctx.font = `900 ${size}px "Arial Black","Arial Bold",Impact,system-ui,sans-serif`;
  const w = ctx.measureText(str).width;
  ctx.restore();
  return w;
}

/* ----------------------------------------------------------------------------
   6. AUDIO  (all procedural — no assets)
   -------------------------------------------------------------------------- */
const Audio_ = {
  ac: null, master: null, muted: false, ready: false,
  droneOsc: null, droneGain: null, droneFilt: null, lfo: null, lfoGain: null,
  tickNext: 0,

  init(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    const comp = this.ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22;
    comp.ratio.value = 7; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master = this.ac.createGain();
    this.master.gain.value = this.muted ? 0 : 0.72;
    this.master.connect(comp); comp.connect(this.ac.destination);
    this.ready = true;
  },
  resume(){ if (this.ac && this.ac.state === "suspended") this.ac.resume(); },
  setMuted(m){
    this.muted = m;
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.72, this.ac.currentTime, 0.02);
  },
  now(){ return this.ac ? this.ac.currentTime : 0; },

  tone(freq, dur, {type="triangle", vol=0.3, atk=0.006, slide=0, delay=0, detune=0} = {}){
    if (!this.ready || this.muted) return;
    const t = this.now() + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq*slide), t+dur);
    if (detune) o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t+dur+0.03);
  },
  noise(dur, {vol=0.3, f0=2600, f1=180, q=1.1, delay=0, type="lowpass"} = {}){
    if (!this.ready || this.muted) return;
    const t = this.now() + delay;
    const n = Math.max(1, Math.floor(this.ac.sampleRate * dur));
    const buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ac.createBufferSource(); src.buffer = buf;
    const flt = this.ac.createBiquadFilter();
    flt.type = type; flt.Q.value = q;
    flt.frequency.setValueAtTime(f0, t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(60, f1), t+dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur+0.02);
  },

  startDrone(){
    if (!this.ready || this.droneOsc) return;
    const t = this.now();
    this.droneOsc  = this.ac.createOscillator();
    this.droneGain = this.ac.createGain();
    this.droneFilt = this.ac.createBiquadFilter();
    this.lfo = this.ac.createOscillator();
    this.lfoGain = this.ac.createGain();

    this.droneOsc.type = "sawtooth";
    this.droneOsc.frequency.setValueAtTime(120, t);
    this.droneFilt.type = "lowpass"; this.droneFilt.Q.value = 5;
    this.droneFilt.frequency.setValueAtTime(500, t);
    this.droneGain.gain.setValueAtTime(0.0001, t);
    this.droneGain.gain.exponentialRampToValueAtTime(0.07, t+0.05);

    this.lfo.type = "sine"; this.lfo.frequency.setValueAtTime(5, t);
    this.lfoGain.gain.setValueAtTime(0, t);
    this.lfo.connect(this.lfoGain); this.lfoGain.connect(this.droneOsc.frequency);

    this.droneOsc.connect(this.droneFilt);
    this.droneFilt.connect(this.droneGain);
    this.droneGain.connect(this.master);
    this.droneOsc.start(t); this.lfo.start(t);
  },
  updateDrone(strain, ripeness){
    if (!this.droneOsc) return;
    const t = this.now();
    const f = 110 + 300*ripeness + 340*strain*strain;
    this.droneOsc.frequency.setTargetAtTime(f, t, 0.03);
    this.droneFilt.frequency.setTargetAtTime(420 + 2600*strain, t, 0.05);
    this.droneGain.gain.setTargetAtTime(0.05 + 0.09*strain, t, 0.05);
    this.lfo.frequency.setTargetAtTime(4 + 16*strain, t, 0.05);
    this.lfoGain.gain.setTargetAtTime(2 + 34*strain*strain, t, 0.05);
  },
  stopDrone(){
    if (!this.droneOsc) return;
    const t = this.now();
    this.droneGain.gain.setTargetAtTime(0.0001, t, 0.015);
    const o = this.droneOsc, l = this.lfo;
    try { o.stop(t+0.12); l.stop(t+0.12); } catch(e){}
    this.droneOsc = null; this.lfo = null;
  },

  // strain heartbeat: a click that accelerates as the fog closes in
  tickIfDue(strain, dt){
    if (!this.ready || this.muted || strain <= 0) return;
    this.tickNext -= dt;
    if (this.tickNext <= 0){
      this.tickNext = lerp(0.34, 0.075, strain);
      this.tone(lerp(500, 1250, strain), 0.045, { type:"square", vol:0.055 + 0.08*strain, atk:0.002 });
    }
  },
  resetTick(){ this.tickNext = 0.001; },

  enterFog(){
    this.tone(880, 0.09, { type:"square", vol:0.13, atk:0.002, slide:0.6 });
    this.noise(0.08, { vol:0.10, f0:2400, f1:600 });
  },
  pluck(chain, clutch){
    // pentatonic ladder — the chain literally sounds like it is climbing
    const PENT = [0,2,4,7,9];
    const step = clamp(chain-1, 0, 34);
    const semi = PENT[step % 5] + 12*Math.floor(step/5);
    const f = 294 * Math.pow(2, semi/12);
    this.tone(f,     0.34, { type:"triangle", vol:0.30, atk:0.004 });
    this.tone(f*2,   0.20, { type:"sine",     vol:0.13, atk:0.004 });
    this.tone(f*0.5, 0.28, { type:"sine",     vol:0.10, atk:0.008 });
    this.noise(0.075, { vol:0.16, f0:3600, f1:800 });
    if (clutch){
      [0,1,2,3].forEach(i =>
        this.tone(f*Math.pow(2,(4+i*3)/12), 0.20, { type:"sine", vol:0.20, atk:0.003, delay:i*0.045 }));
    }
  },
  burst(){
    this.noise(0.42, { vol:0.55, f0:4200, f1:120, q:0.8 });
    this.tone(150, 0.34, { type:"sawtooth", vol:0.32, slide:0.25, atk:0.003 });
    this.tone(74,  0.44, { type:"sine",     vol:0.40, slide:0.4,  atk:0.004 });
    this.noise(0.24, { vol:0.20, f0:900, f1:200, type:"bandpass", q:3, delay:0.05 });
  },
  overtime(){
    this.tone(180, 0.85, { type:"sawtooth", vol:0.22, slide:4.2, atk:0.25 });
    this.noise(0.9, { vol:0.20, f0:400, f1:5000, type:"bandpass", q:1.2 });
    [0,4,7,12].forEach((s,i) =>
      this.tone(220*Math.pow(2,s/12), 0.45, { type:"square", vol:0.16, delay:0.55+i*0.05 }));
  },
  milestone(n){
    const root = 330 * Math.pow(2, Math.min(n/5-1, 4)*2/12);
    [0,4,7,12].forEach((s,i) =>
      this.tone(root*Math.pow(2,s/12), 0.42, { type:"triangle", vol:0.22, delay:i*0.055 }));
    this.noise(0.3, { vol:0.16, f0:600, f1:4200, type:"bandpass", q:1.3 });
  },
  otPulse(){ this.tone(73, 0.24, { type:"sine", vol:0.30, atk:0.005 }); },
  beep(hi){ this.tone(hi?1046:660, 0.12, { type:"square", vol:0.20 }); },
  whoosh(){ this.noise(0.30, { vol:0.22, f0:220, f1:2800, type:"bandpass", q:1.4 }); },
  fanfare(){
    [0,4,7,12,16].forEach((s,i) =>
      this.tone(330*Math.pow(2,s/12), 0.55, { type:"triangle", vol:0.24, delay:i*0.085 }));
  },
  thud(){ this.tone(110, 0.22, { type:"sine", vol:0.26, slide:0.5 }); this.noise(0.12,{vol:0.14,f0:1200,f1:200}); },
};

/* ----------------------------------------------------------------------------
   7. SAVE DATA
   -------------------------------------------------------------------------- */
const Save = {
  data: { best:0, pace:null, runs:0, bestChain:0, bestPluck:0, deepest:0, muted:false },
  load(){
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) Object.assign(this.data, JSON.parse(raw));
    } catch(e){}
    Audio_.muted = !!this.data.muted;
  },
  save(){
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch(e){}
  },
};
Save.load();

/* ----------------------------------------------------------------------------
   8. VERLET STEM  (real rope: sag, stretch under load, snap-back, sway)
   -------------------------------------------------------------------------- */
class Stem {
  constructor(){
    this.pts = [];
    this.rest = STEM_LEN/(STEM_NODES-1);
    for (let i=0;i<STEM_NODES;i++){
      const y = ANCHOR.y + this.rest*i;
      this.pts.push({ x:ANCHOR.x, y, px:ANCHOR.x, py:y, inv: i===0 ? 0 : 1 });
    }
    this.tipInv = 1;
  }
  reset(){
    for (let i=0;i<this.pts.length;i++){
      const p = this.pts[i];
      p.x = p.px = ANCHOR.x;
      p.y = p.py = ANCHOR.y + this.rest*i;
    }
  }
  get tip(){ return this.pts[this.pts.length-1]; }
  tipVel(dt){
    const t = this.tip;
    return { vx:(t.x-t.px)/dt, vy:(t.y-t.py)/dt };
  }
  /** unit vector of the last segment — the direction the fruit hangs */
  tipDir(){
    const n = this.pts.length;
    const a = this.pts[n-2], b = this.pts[n-1];
    let dx = b.x-a.x, dy = b.y-a.y;
    const d = Math.hypot(dx,dy) || 1;
    return { x:dx/d, y:dy/d };
  }
  step(dt, { stretch=1, mass=1, wind=0, attached=true } = {}){
    const damp = attached ? 0.986 : 0.90;
    const pts = this.pts;
    this.tipInv = attached ? 1/Math.max(1, mass) : 1;

    for (let i=0;i<pts.length;i++){
      const p = pts[i];
      if (p.inv === 0){ p.x = p.px = ANCHOR.x; p.y = p.py = ANCHOR.y; continue; }
      const isTip = i === pts.length-1;
      const vx = (p.x - p.px)*damp;
      const vy = (p.y - p.py)*damp;
      p.px = p.x; p.py = p.y;
      const g = attached ? GRAV*0.42 * (isTip ? mass*0.85 : 1) : GRAV*0.16;
      const w = wind * (i/pts.length) * (isTip ? 2.2 : 1);
      p.x += vx + w*dt*dt;
      p.y += vy + g*dt*dt;
    }

    const restLen = this.rest * (attached ? stretch : 1);
    for (let k=0;k<7;k++){
      for (let i=0;i<pts.length-1;i++){
        const a = pts[i], b = pts[i+1];
        const ai = a.inv, bi = (i+1 === pts.length-1) ? this.tipInv : b.inv;
        const sum = ai + bi;
        if (sum === 0) continue;
        const dx = b.x-a.x, dy = b.y-a.y;
        const d = Math.hypot(dx,dy) || 1e-6;
        const diff = (d - restLen)/d * 0.85;
        const cx = dx*diff, cy = dy*diff;
        a.x += cx * (ai/sum); a.y += cy * (ai/sum);
        b.x -= cx * (bi/sum); b.y -= cy * (bi/sum);
      }
      // light bending stiffness so it reads as a stem, not a chain
      for (let i=1;i<pts.length-1;i++){
        const a = pts[i-1], b = pts[i], c = pts[i+1];
        b.x += ((a.x+c.x)*0.5 - b.x)*0.10;
        b.y += ((a.y+c.y)*0.5 - b.y)*0.10;
      }
    }
  }
  /** kick the free stem so it whips after a pluck */
  fling(vx, vy){
    for (let i=1;i<this.pts.length;i++){
      const p = this.pts[i], k = i/this.pts.length;
      p.px -= vx*k*0.0035; p.py -= vy*k*0.0035;
    }
  }
  draw(color, lit, width){
    const pts = this.pts;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    for (let pass=0; pass<3; pass++){
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pts[0].y);
      for (let i=1;i<pts.length-1;i++){
        ctx.quadraticCurveTo(pts[i].x, pts[i].y,
                             (pts[i].x + pts[i+1].x)/2, (pts[i].y + pts[i+1].y)/2);
      }
      ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
      if (pass === 0){ ctx.strokeStyle = INK;   ctx.lineWidth = width+10; }
      if (pass === 1){ ctx.strokeStyle = color; ctx.lineWidth = width; }
      if (pass === 2){ ctx.strokeStyle = lit;   ctx.lineWidth = Math.max(2.5, width*0.30);
                       ctx.translate(-width*0.24, -width*0.20); }
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ----------------------------------------------------------------------------
   9. PARTICLES
   -------------------------------------------------------------------------- */
const shards = [], drops = [], sparks = [], pops = [], rings = [];
const leaves = [], splats = [], motes = [];

function spawnShards(x, y, r, base, n, power){
  const dark = shade(base,-0.30), lit = shade(base, 0.32);
  for (let i=0;i<n;i++){
    const a0 = (i/n)*TAU, a1 = ((i+1)/n)*TAU;
    const verts = [[0,0]];
    for (let s=0;s<=3;s++){
      const a = lerp(a0,a1,s/3), rr = r*rand(0.78,1.05);
      verts.push([Math.cos(a)*rr, Math.sin(a)*rr]);
    }
    const am = (a0+a1)/2;
    shards.push({
      x, y,
      vx: Math.cos(am)*power*rand(0.55,1.25) + rand(-60,60),
      vy: Math.sin(am)*power*rand(0.55,1.25) - rand(140, 420),
      a: rand(0,TAU), va: rand(-11,11),
      verts, base, dark, lit, life: rand(1.5,2.4), age:0, bounces:0, scaleY:1,
    });
  }
}
function spawnDrops(x,y,n,base,power){
  for (let i=0;i<n;i++){
    const a = rand(0,TAU);
    drops.push({
      x, y, vx:Math.cos(a)*power*rand(0.3,1.3), vy:Math.sin(a)*power*rand(0.3,1.1) - rand(80,420),
      r: rand(4,13), base, life: rand(1.1,2.0), age:0,
    });
  }
}
function spawnSparks(x,y,n,color,power){
  for (let i=0;i<n;i++){
    const a = rand(0,TAU);
    sparks.push({
      x,y, vx:Math.cos(a)*power*rand(0.35,1), vy:Math.sin(a)*power*rand(0.35,1)-rand(30,180),
      r: rand(5,14), color, life: rand(0.35,0.8), age:0, a:rand(0,TAU), va:rand(-14,14),
    });
  }
}
function popText(x,y,text,color,{size=54, sub=null, life=1.25, rise=115}={}){
  pops.push({ x,y,text,color,size,sub,life,age:0,rise });
}
function ring(x,y,color,r0,r1,life,width){
  rings.push({x,y,color,r0,r1,life,age:0,width});
}

function initAmbient(){
  leaves.length = 0; motes.length = 0;
  for (let i=0;i<14;i++){
    leaves.push({
      x: rand(view.x0-60, view.x1+60), y: rand(-200, VH),
      s: rand(0.45,1.0), a: rand(0,TAU), va: rand(-1.6,1.6),
      vy: rand(22,58), ph: rand(0,TAU),
      c: [LEAF, LEAF_LIT, LEAF_DARK, "#3fae6b"][randi(0,3)],
    });
  }
  for (let i=0;i<26;i++){
    motes.push({
      x: rand(view.x0, view.x1), y: rand(560, 1140),
      r: rand(2.2,5.4), ph: rand(0,TAU), sp: rand(0.5,1.5),
      vx: rand(-14,14), vy: rand(-22,-5),
      c: ["#FFE7A8","#FFC96B","#FFAE87"][randi(0,2)],
    });
  }
}

function updateParticles(dt, t){
  for (let i=shards.length-1;i>=0;i--){
    const s = shards[i];
    s.age += dt;
    s.vy += GRAV*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
    s.a += s.va*dt;
    s.va *= (1 - 1.1*dt);
    s.scaleY += (1 - s.scaleY)*10*dt;
    if (s.y > GROUND && s.vy > 0){
      s.y = GROUND;
      if (Math.abs(s.vy) > 130 && s.bounces < 3){
        s.vy *= -0.42; s.vx *= 0.66; s.va *= 0.5; s.bounces++;
        s.scaleY = 0.6;
        if (s.bounces === 1) splats.push({x:s.x, y:GROUND, r:rand(10,26), c:s.dark, age:0, life:2.2});
      } else { s.vy = 0; s.vx *= 0.80; s.va *= 0.7; }
    }
    if (s.age > s.life) shards.splice(i,1);
  }
  for (let i=drops.length-1;i>=0;i--){
    const d = drops[i];
    d.age += dt; d.vy += GRAV*0.86*dt;
    d.x += d.vx*dt; d.y += d.vy*dt;
    if (d.y > GROUND){
      splats.push({x:d.x, y:GROUND, r:d.r*rand(1.1,1.9), c:shade(d.base,-0.22), age:0, life:2.4});
      drops.splice(i,1); continue;
    }
    if (d.age > d.life) drops.splice(i,1);
  }
  for (let i=sparks.length-1;i>=0;i--){
    const s = sparks[i];
    s.age += dt; s.vy += GRAV*0.35*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
    s.vx *= (1-1.6*dt); s.a += s.va*dt;
    if (s.age > s.life) sparks.splice(i,1);
  }
  for (let i=pops.length-1;i>=0;i--){ pops[i].age += dt; if (pops[i].age > pops[i].life) pops.splice(i,1); }
  for (let i=rings.length-1;i>=0;i--){ rings[i].age += dt; if (rings[i].age > rings[i].life) rings.splice(i,1); }
  for (let i=splats.length-1;i>=0;i--){ splats[i].age += dt; if (splats[i].age > splats[i].life) splats.splice(i,1); }

  for (const l of leaves){
    l.y += l.vy*dt;
    l.x += Math.sin(t*0.7 + l.ph)*26*dt + Wind.value*0.010*dt*60;
    l.a += l.va*dt;
    if (l.y > view.y1 + 80){ l.y = view.y0 - 60; l.x = rand(view.x0-40, view.x1+40); }
  }
  for (const m of motes){
    m.x += (m.vx + Math.sin(t*m.sp + m.ph)*16)*dt;
    m.y += m.vy*dt;
    if (m.y < 480){ m.y = rand(1080,1200); m.x = rand(view.x0, view.x1); }
    if (m.x < view.x0-20) m.x = view.x1+20;
    if (m.x > view.x1+20) m.x = view.x0-20;
  }
}

function drawShard(s){
  const k = clamp(1 - (s.age - (s.life-0.4))/0.4, 0, 1);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(s.x, s.y);
  ctx.rotate(s.a);
  ctx.scale(1, s.scaleY);
  const path = () => {
    ctx.beginPath();
    ctx.moveTo(s.verts[0][0], s.verts[0][1]);
    for (let i=1;i<s.verts.length;i++) ctx.lineTo(s.verts[i][0], s.verts[i][1]);
    ctx.closePath();
  };
  path();
  ctx.fillStyle = s.base; ctx.fill();
  ctx.save(); path(); ctx.clip();
  ctx.fillStyle = s.dark; ctx.beginPath(); ctx.arc(14, 16, 40, 0, TAU); ctx.fill();
  ctx.fillStyle = s.lit;  ctx.beginPath(); ctx.arc(-16,-18, 14, 0, TAU); ctx.fill();
  ctx.restore();
  path();                       // re-issue: clip() consumed the working path
  inkStroke(5);
  ctx.restore();
}
function drawDrop(d){
  const k = clamp(1 - (d.age-(d.life-0.3))/0.3, 0, 1);
  ctx.save();
  ctx.globalAlpha = k;
  const stretch = clamp(1 + Math.abs(d.vy)/1400, 1, 2.1);
  ctx.translate(d.x, d.y);
  ctx.rotate(Math.atan2(d.vy, d.vx) - Math.PI/2);
  ctx.beginPath();
  ctx.ellipse(0,0, d.r, d.r*stretch, 0, 0, TAU);
  ctx.fillStyle = d.base; ctx.fill();
  inkStroke(3.5);
  ctx.beginPath();
  ctx.ellipse(-d.r*0.28, -d.r*0.35, d.r*0.26, d.r*0.34, 0, 0, TAU);
  ctx.fillStyle = shade(d.base, 0.5); ctx.fill();
  ctx.restore();
}
function drawSpark(s){
  const k = clamp(1 - s.age/s.life, 0, 1);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(s.x, s.y); ctx.rotate(s.a);
  const r = s.r*(0.4 + 0.6*k);
  ctx.beginPath();
  for (let i=0;i<4;i++){
    const a = i*Math.PI/2;
    ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.lineTo(Math.cos(a+Math.PI/4)*r*0.34, Math.sin(a+Math.PI/4)*r*0.34);
  }
  ctx.closePath();
  ctx.fillStyle = s.color; ctx.fill();
  ctx.restore();
}
function drawLeaf(l, alpha){
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(l.x, l.y); ctx.rotate(l.a); ctx.scale(l.s, l.s);
  ctx.beginPath();
  ctx.moveTo(0,-22);
  ctx.quadraticCurveTo(20,-6, 0,24);
  ctx.quadraticCurveTo(-20,-6, 0,-22);
  ctx.closePath();
  ctx.fillStyle = l.c; ctx.fill();
  inkStroke(4);
  ctx.beginPath(); ctx.moveTo(0,-18); ctx.lineTo(0,18);
  ctx.strokeStyle = shade(l.c,-0.3); ctx.lineWidth = 2.4; ctx.lineCap="round"; ctx.stroke();
  ctx.restore();
}
function drawMote(m, t){
  const pulse = 0.35 + 0.65*(0.5 + 0.5*Math.sin(t*m.sp*2.4 + m.ph));
  ctx.save();
  ctx.globalAlpha = 0.55*pulse;
  const g = ctx.createRadialGradient(m.x,m.y,0, m.x,m.y,m.r*5);
  g.addColorStop(0, m.c); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(m.x,m.y,m.r*5,0,TAU); ctx.fill();
  ctx.globalAlpha = 0.9*pulse;
  ctx.fillStyle = m.c;
  ctx.beginPath(); ctx.arc(m.x,m.y,m.r,0,TAU); ctx.fill();
  ctx.restore();
}

/* ----------------------------------------------------------------------------
   10. WIND
   -------------------------------------------------------------------------- */
const Wind = {
  value: 0, t: 0,
  update(dt){
    this.t += dt;
    this.value = fbm(this.t*0.31)*820 + fbm(this.t*0.91+40)*260;
  },
  gust(v){ this.value += v; },
};

/* ----------------------------------------------------------------------------
   11. BACKGROUND  (baked once per resize)
   -------------------------------------------------------------------------- */
function hillOutline(g, L, x0, x1, close){
  g.beginPath();
  if (close) { g.moveTo(x0, L.y + 500); g.lineTo(x0, L.y + fbm(x0*L.freq + L.seed)*L.amp); }
  for (let x = x0; x <= x1; x += 12) g.lineTo(x, L.y + fbm(x*L.freq + L.seed)*L.amp);
  if (close){ g.lineTo(x1, L.y + 500); g.closePath(); }
}
function celTree(g, x, y, s, body, top, trunk){
  g.save(); g.translate(x,y); g.scale(s,s);
  g.beginPath(); g.moveTo(-7,0); g.lineTo(-4,-34); g.lineTo(4,-34); g.lineTo(7,0); g.closePath();
  g.fillStyle = trunk; g.fill();
  g.beginPath();
  subCircle(g,-20,-46,24); subCircle(g,16,-44,21); subCircle(g,-2,-66,26); subCircle(g,-2,-40,26);
  g.fillStyle = body; g.fill();
  g.save(); g.clip();
  g.fillStyle = top; g.beginPath(); subCircle(g,-14,-72,26); g.fill();
  g.restore();
  g.restore();
}

function bakeBackground(){
  const key = `${cvs.width}x${cvs.height}`;
  if (key === bgKey && bgCanvas) return;
  bgKey = key;
  bgCanvas = document.createElement("canvas");
  bgCanvas.width = cvs.width; bgCanvas.height = cvs.height;
  const g = bgCanvas.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.lineJoin = "round"; g.lineCap = "round";

  const w = window.innerWidth, h = window.innerHeight;
  const grad = g.createLinearGradient(0,0,0,h);
  for (const [p,c] of SKY) grad.addColorStop(p, c);
  g.fillStyle = grad; g.fillRect(0,0,w,h);

  g.translate(ox, oy); g.scale(scale, scale);
  const x0 = view.x0 - 40, x1 = view.x1 + 40;

  /* --- sun ------------------------------------------------------------- */
  const sunX = 360, sunY = 1002, sunR = 196;
  g.save();
  for (const [rm, col] of [[2.10,"rgba(255,190,120,0.10)"],[1.62,"rgba(255,205,135,0.15)"],[1.26,"rgba(255,222,160,0.24)"]]){
    g.beginPath(); g.arc(sunX,sunY,sunR*rm,0,TAU); g.fillStyle = col; g.fill();
  }
  g.beginPath(); g.arc(sunX,sunY,sunR,0,TAU);
  g.fillStyle = "#FFE9AE"; g.fill();
  g.beginPath(); g.arc(sunX,sunY,sunR*0.80,0,TAU);
  g.fillStyle = "#FFF6D4"; g.fill();
  // banded sun-stripes, a classic cel sunset trick
  g.save();
  g.beginPath(); g.arc(sunX,sunY,sunR,0,TAU); g.clip();
  g.fillStyle = "rgba(255,150,110,0.30)";
  for (let i=0;i<5;i++) g.fillRect(sunX-sunR, sunY - sunR + 44 + i*46, sunR*2, 13);
  g.restore();
  g.restore();

  /* --- clouds ---------------------------------------------------------- */
  const clouds = [
    [ 96, 268, 1.00, 0.34, "#C9A0DC", "#A87DC4"],
    [560, 196, 0.74, 0.30, "#C9A0DC", "#A87DC4"],
    [660, 430, 0.86, 0.34, "#D9A6C8", "#B885B1"],
    [ 40, 520, 0.66, 0.32, "#DDA8C0", "#BC87AA"],
    [330, 640, 0.54, 0.30, "#EDB39F", "#D0917F"],
    [605, 760, 0.62, 0.30, "#F5BE9A", "#DA9C7C"],
    [110, 828, 0.50, 0.28, "#F8C79C", "#E0A47E"],
  ];
  for (const [cx,cy,cs,al,top,bot] of clouds){
    g.save();
    g.globalAlpha = al;
    g.translate(cx, cy); g.scale(cs, cs);
    g.beginPath();
    subCircle(g,-58, 4, 34); subCircle(g,-8,-20, 50);
    subCircle(g, 46, 0, 38); subCircle(g, 88, 14, 24);
    g.rect(-92, 4, 204, 32);
    g.fillStyle = top; g.fill();
    g.save(); g.clip();
    g.fillStyle = bot; g.fillRect(-140, 14, 300, 60);
    g.restore();
    g.restore();
  }

  /* --- hills ----------------------------------------------------------- */
  const layers = [
    { y: 946,    amp: 58, freq: 0.0031, seed:   3.1, c:HILL_FAR,  top:HILL_FAR_TOP,  rim:HILL_FAR_RIM,  th:22, ink:6 },
    { y: 1022,   amp: 44, freq: 0.0049, seed:  77.4, c:HILL_MID,  top:HILL_MID_TOP,  rim:HILL_MID_RIM,  th:19, ink:7 },
    { y: GROUND, amp: 20, freq: 0.0072, seed: 151.9, c:HILL_NEAR, top:HILL_NEAR_TOP, rim:HILL_NEAR_RIM, th:16, ink:8 },
  ];
  layers.forEach((L, li) => {
    if (li === 1){
      // a little copse on the far ridge, drawn before the mid hill covers its feet
      for (const [tx,ts] of [[118,0.9],[176,0.62],[236,1.05],[528,0.85],[588,1.15],[646,0.7]]){
        celTree(g, tx, L.y + fbm(tx*L.freq + L.seed)*L.amp + 6, ts,
                shade(HILL_FAR,-0.16), shade(HILL_FAR, 0.10), shade(HILL_FAR,-0.30));
      }
    }
    hillOutline(g, L, x0, x1, true);
    g.fillStyle = L.c; g.fill();
    g.save(); g.clip();
    // sunlit crown band
    hillOutline(g, L, x0, x1, false);
    g.strokeStyle = L.top; g.lineWidth = L.th*2; g.stroke();
    // warm rim right at the silhouette edge
    hillOutline(g, L, x0, x1, false);
    g.strokeStyle = L.rim; g.lineWidth = 5; g.globalAlpha = 0.55; g.stroke();
    g.restore();
    hillOutline(g, L, x0, x1, true);
    g.strokeStyle = INK; g.lineWidth = L.ink; g.stroke();
  });

  /* --- grass tufts on the near ridge ----------------------------------- */
  const NL = layers[2];
  const GRASS      = shade(HILL_NEAR_TOP, 0.16);
  const GRASS_EDGE = mixHex(HILL_NEAR_TOP, INK, 0.55);
  for (let x = x0 + 24; x < x1; x += 118){
    const bx = x + hash1(x*0.31)*70;
    const by = NL.y + fbm(bx*NL.freq + NL.seed)*NL.amp + 6;
    const blades = 2 + Math.floor(hash1(bx*1.7)*2.99);
    g.save(); g.translate(bx, by);
    g.beginPath();
    for (let i=0;i<blades;i++){
      const px   = (i - (blades-1)/2) * 22;
      const hgt  = 20 + hash1(bx + i*3.3)*20;
      const lean = (hash1(bx + i*7.1) - 0.5)*30;
      g.moveTo(px - 13, 10);
      g.quadraticCurveTo(px + lean*0.25 - 4, -hgt*0.60, px + lean, -hgt);
      g.quadraticCurveTo(px + lean*0.18 + 12, -hgt*0.50, px + 13, 10);
      g.closePath();
    }
    g.fillStyle = GRASS; g.fill();
    g.strokeStyle = GRASS_EDGE; g.lineWidth = 3; g.stroke();
    g.restore();
  }
}

/* ----------------------------------------------------------------------------
   12. BRANCH  (the thing the stem hangs from)
   -------------------------------------------------------------------------- */
function drawBranch(sway){
  const x0 = view.x0 - 30;
  const pts = [[x0,192],[x0+150,222],[168,196],[266,266],[ANCHOR.x,278]];
  ctx.save();
  for (let pass=0; pass<3; pass++){
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length-1;i++){
      ctx.quadraticCurveTo(pts[i][0], pts[i][1] + sway*0.4*(i/pts.length),
                           (pts[i][0]+pts[i+1][0])/2, (pts[i][1]+pts[i+1][1])/2);
    }
    ctx.lineTo(pts[4][0], pts[4][1] + sway*0.5);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    if (pass===0){ ctx.strokeStyle = INK;      ctx.lineWidth = 58; }
    if (pass===1){ ctx.strokeStyle = BARK;     ctx.lineWidth = 44; }
    if (pass===2){ ctx.strokeStyle = BARK_LIT; ctx.lineWidth = 13; ctx.translate(0,-12); }
    ctx.stroke();
  }
  ctx.restore();

  // leaf cluster at the attach point
  ctx.save();
  ctx.translate(ANCHOR.x, ANCHOR.y - 8);
  const cluster = [[-62,-30,-0.55,1.05],[-18,-56,-0.05,0.95],[38,-36,0.55,1.0],[76,-6,1.05,0.8],[-92,2,-1.05,0.82]];
  for (const [lx,ly,la,ls] of cluster){
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(la + Math.sin(Wind.t*1.6 + lx)*0.10 + sway*0.0009);
    ctx.scale(ls,ls);
    const path = () => {
      ctx.beginPath();
      ctx.moveTo(0,-30);
      ctx.quadraticCurveTo(26,-6, 0,32);
      ctx.quadraticCurveTo(-26,-6, 0,-30);
      ctx.closePath();
    };
    path(); ctx.fillStyle = LEAF; ctx.fill();
    ctx.save(); path(); ctx.clip();
    ctx.fillStyle = LEAF_DARK; ctx.beginPath(); ctx.arc(16,18,26,0,TAU); ctx.fill();
    ctx.fillStyle = LEAF_LIT;  ctx.beginPath(); ctx.arc(-11,-14,11,0,TAU); ctx.fill();
    ctx.restore();
    path();                    // re-issue: clip() consumed the working path
    inkStroke(5.5);
    ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(0,26);
    ctx.strokeStyle = LEAF_DARK; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}

/* ----------------------------------------------------------------------------
   13. THE GEM
   -------------------------------------------------------------------------- */
function gemPath(r, wob, phase){
  ctx.beginPath();
  const N = 32;
  for (let i=0;i<=N;i++){
    const a = (i/N)*TAU - Math.PI/2;
    const bump = 1 + Math.sin(a*3 + phase)*0.020*wob + Math.sin(a*5 - phase*1.4)*0.013*wob;
    const x = Math.cos(a)*r*1.02*bump;
    const y = Math.sin(a)*r*0.98*bump + Math.max(0, Math.sin(a))*r*0.06;
    if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
}

function drawGem(x, y, r, base, {strain=0, sq=1, tilt=0, alpha=1, phase=0, glow=0, shadow=true} = {}){
  // shadows shift toward magenta rather than toward black — keeps the fruit
  // reading as ripe instead of rotten, and ties it to the sunset
  const dark  = mixHex(base, "#8E2E63", 0.40);
  const dark2 = mixHex(base, "#5C2058", 0.58);
  const lit   = shade(base, 0.32);
  const bounce= mixHex(base, "#FFC2E2", 0.45);
  const wob   = 1 + strain*2.6;

  ctx.save();
  ctx.globalAlpha = alpha;

  if (shadow){
    ctx.save();
    ctx.globalAlpha = alpha*0.22;
    ctx.beginPath();
    ctx.ellipse(x + 14, GROUND - 6, r*0.92, r*0.22, 0, 0, TAU);
    ctx.fillStyle = "#12081f"; ctx.fill();
    ctx.restore();
  }

  if (glow > 0){
    ctx.save();
    ctx.globalAlpha = alpha*glow*0.6;
    const gg = ctx.createRadialGradient(x,y,r*0.7, x,y,r*2.4);
    gg.addColorStop(0, base); gg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(x,y,r*2.4,0,TAU); ctx.fill();
    ctx.restore();
  }

  ctx.translate(x, y);
  ctx.rotate(tilt);
  ctx.scale(1/Math.sqrt(sq), sq);

  gemPath(r, wob, phase);
  ctx.fillStyle = base; ctx.fill();

  ctx.save();
  gemPath(r, wob, phase);
  ctx.clip();

  // one clean terminator, then a thin darker rim hugging the far edge
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.arc(r*0.72, r*0.68, r*1.02, 0, TAU); ctx.fill();
  ctx.fillStyle = dark2;
  ctx.beginPath(); ctx.arc(r*1.22, r*1.14, r*0.86, 0, TAU); ctx.fill();
  ctx.globalAlpha = alpha*0.9;
  ctx.strokeStyle = bounce; ctx.lineWidth = r*0.13;
  ctx.beginPath(); ctx.arc(0,0, r*0.94, Math.PI*0.14, Math.PI*0.74); ctx.stroke();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = lit;
  ctx.beginPath(); ctx.arc(-r*0.54, -r*0.58, r*0.60, 0, TAU); ctx.fill();

  // stress fractures spread down from the crown, where the stem is pulling
  if (strain > 0.04){
    const n = Math.floor(strain*7) + 1;
    ctx.lineCap = "round";
    for (let i=0;i<n;i++){
      const seed = i*17.3 + Math.floor(phase*0.4);
      let ang = Math.PI*0.5 + (hash1(seed)-0.5)*2.0;     // roughly downward
      let cx = (hash1(seed+1.7)-0.5)*r*0.7, cy = -r*0.72;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      for (let s=0;s<3;s++){
        ang += (hash1(seed+s*3.7)-0.5)*1.3;
        const L = r*(0.18 + strain*0.26)*(1 - s*0.18);
        cx += Math.cos(ang)*L; cy += Math.sin(ang)*L;
        ctx.lineTo(cx,cy);
      }
      ctx.globalAlpha = alpha*clamp(strain*2.2,0,1);
      ctx.strokeStyle = dark2; ctx.lineWidth = r*0.05*(0.6+strain); ctx.stroke();
      ctx.globalAlpha = alpha*clamp(strain*1.6,0,0.75);
      ctx.strokeStyle = shade(base,0.55); ctx.lineWidth = r*0.020; ctx.stroke();
      ctx.globalAlpha = alpha;
    }
  }
  ctx.restore();

  gemPath(r, wob, phase);
  inkStroke(7 + strain*3.5);

  ctx.save();
  ctx.globalAlpha = alpha*0.96;
  ctx.fillStyle = "#FFFFFF";
  ctx.beginPath(); ctx.ellipse(-r*0.44, -r*0.48, r*0.145, r*0.235, -0.58, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(-r*0.19, -r*0.64, r*0.068, 0, TAU); ctx.fill();
  ctx.restore();

  // calyx
  ctx.save();
  ctx.translate(0, -r*0.92);
  for (const s of [-1, 1]){
    ctx.save();
    ctx.scale(s,1); ctx.rotate(-0.55);
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(r*0.32, -r*0.22, r*0.50, r*0.04);
    ctx.quadraticCurveTo(r*0.30, r*0.18, 0, 0);
    ctx.closePath();
    ctx.fillStyle = LEAF; ctx.fill();
    inkStroke(4.5);
    ctx.restore();
  }
  ctx.restore();

  ctx.restore();
}

/* ----------------------------------------------------------------------------
   14. STRAIN RING
   The track runs 0 -> FOG_END. Green = guaranteed safe. Hatched = the fog,
   where the stem might go at any moment. Past the fog, the track is DEAD —
   and that dead stretch grows toward you as the hold gets longer.
   -------------------------------------------------------------------------- */
const RING_GAP = 0.70;
const RING_A0  = -Math.PI/2 + RING_GAP/2;
const RING_SW  = TAU - RING_GAP;
const ringAngle = t => RING_A0 + (clamp(t,0,FOG_END)/FOG_END)*RING_SW;

function arcAt(cx,cy,rad,t0,t1,style,width,cap){
  if (t1 <= t0 + 0.0005) return;
  ctx.beginPath();
  ctx.arc(cx, cy, rad, ringAngle(t0), ringAngle(t1));
  ctx.strokeStyle = style; ctx.lineWidth = width; ctx.lineCap = cap || "butt";
  ctx.stroke();
}

const ZONE_W = 25;      // zone band thickness
const FILL_W = 11;      // progress arc, thinner so the zone colour rims it

function drawRing(cx, cy, radius, holdT, safeEnd, fogLo, fogHi, heat, alpha, seed, pulse){
  ctx.save();
  ctx.globalAlpha = alpha;

  // ink backing so the whole gauge pops off the sky
  arcAt(cx,cy,radius, 0, FOG_END, "rgba(16,8,32,0.80)", ZONE_W + 7);
  arcAt(cx,cy,radius, 0, FOG_END, "rgba(46,26,74,0.92)", ZONE_W);        // unknown track
  arcAt(cx,cy,radius, fogHi, FOG_END, "rgba(22,10,40,0.95)", ZONE_W);    // dead stretch
  arcAt(cx,cy,radius, 0, safeEnd, "rgba(88,232,132,0.92)", ZONE_W);      // guaranteed safe

  // the uncertain band — jittery, never quite still
  if (fogHi > fogLo){
    const a0 = ringAngle(fogLo), a1 = ringAngle(fogHi);
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, radius, a0, a1);
    ctx.strokeStyle = `rgba(190,40,60,${0.42 + 0.14*pulse})`;
    ctx.lineWidth = ZONE_W; ctx.lineCap = "butt"; ctx.stroke();
    const steps = Math.max(2, Math.floor((a1-a0)/0.052));
    ctx.lineWidth = 4.2; ctx.lineCap = "round";
    for (let i=0;i<=steps;i++){
      const a  = lerp(a0, a1, i/steps) + (hash1(i*3.1 + seed)-0.5)*0.032;
      const r0 = radius - ZONE_W/2 + (hash1(i*7.7+seed)-0.5)*5;
      const r1 = radius + ZONE_W/2 + (hash1(i*11.3+seed)-0.5)*5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a)*r0, cy + Math.sin(a)*r0);
      ctx.lineTo(cx + Math.cos(a)*r1, cy + Math.sin(a)*r1);
      ctx.strokeStyle = `rgba(255,150,132,${0.45 + 0.40*hash1(i*5.5+seed)})`;
      ctx.stroke();
    }
    ctx.restore();
  }

  // the edge of safety — the line you are choosing to cross
  const sa = ringAngle(safeEnd);
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(sa)*(radius - ZONE_W/2 - 5), cy + Math.sin(sa)*(radius - ZONE_W/2 - 5));
  ctx.lineTo(cx + Math.cos(sa)*(radius + ZONE_W/2 + 5), cy + Math.sin(sa)*(radius + ZONE_W/2 + 5));
  ctx.strokeStyle = CREAM; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.stroke();

  // travelled — thin, so the zone underneath still reads
  arcAt(cx,cy,radius, 0, holdT, "rgba(16,8,32,0.55)", FILL_W + 5, "round");
  arcAt(cx,cy,radius, 0, holdT, heat, FILL_W, "round");

  // needle
  const na = ringAngle(holdT);
  ctx.save();
  ctx.translate(cx + Math.cos(na)*radius, cy + Math.sin(na)*radius);
  ctx.rotate(na);
  ctx.beginPath();
  ctx.moveTo(-21,0); ctx.lineTo(6,-13); ctx.lineTo(6,13);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill();
  inkStroke(4);
  ctx.restore();

  ctx.restore();
}

/* ----------------------------------------------------------------------------
   15. GAME STATE
   -------------------------------------------------------------------------- */
const stem = new Stem();

const G = {
  state: "title",
  t: 0,
  timeLeft: RUN_TIME,
  score: 0, shown: 0,
  chain: 1,
  overtime: false,
  finalPluck: false,
  inFog: false,

  gem: { present:true, scale:1 },
  holding: false,
  needRelease: false,      // after a burst, lift off before the next one arms
  holdT: 0,
  burstAt: SAFE_EARLY,
  regrow: 0,

  fly: null,
  freeze: 0, slowmo: 1,
  shake: 0, shakeT: 0,
  hudPunch: 0, chainPunch: 0,
  otPulseT: 0,
  flash: 0, flashColor: "#ffffff",
  bannerText: "", bannerT: 0, bannerMax: 1, bannerColor: GOLD, bannerSize: 74,
  beepAt: 4,

  plucks: 0, bursts: 0, bestPluck: 0, deepest: 0, topChain: 1, clutches: 0, holdSum: 0,
  streak: 0, bestStreak: 0,
  pace: new Array(RUN_TIME+1).fill(0), paceIdx: 0,

  newBest: false,
  resultsT: 0,
  titleDemo: { hold:true, holdT:0, burstAt:2.4, cool:0 },
};

function safeEndNow(){
  const p = G.state === "play" ? clamp(1 - G.timeLeft/RUN_TIME, 0, 1) : 0;
  return lerp(SAFE_EARLY, SAFE_LATE, p);
}
function gemValue(t){ return VAL_BASE * Math.pow(2, t / VAL_DOUBLE); }
function gemRadius(t){ return GEM_R0 + GEM_RK*t; }
function gemMass(t){ return clamp(Math.pow(gemRadius(t)/GEM_R0, 2.4), 1, 9); }

function rollBurst(){
  const se = safeEndNow();
  return se + (FOG_END - se) * Math.pow(Math.random(), BURST_SKEW);
}
/** The fog closes onto the true burst point — but never fast enough that you
    can react your way out of it. Information costs risk. */
function fogWindow(){
  const B  = G.burstAt;
  const p  = clamp(G.holdT / Math.max(0.001, B), 0, 1);
  const hi = B + (FOG_END - B) * Math.pow(1 - p, 0.8);
  const lo = Math.max(safeEndNow(), G.holdT);
  return [lo, Math.max(lo + 0.02, hi)];
}
function strainNow(){
  const se = safeEndNow();
  if (G.holdT <= se) return 0;
  return clamp((G.holdT - se) / Math.max(0.2, FOG_END - se), 0, 1);
}
const heatColor = t => ramp(RIPE, clamp(t, 0, FOG_END));

function addShake(a){ G.shake = Math.max(G.shake, a); G.shakeT = 0; }
function banner(text, color, dur=1.15, size=74){
  G.bannerText = text; G.bannerColor = color; G.bannerT = dur; G.bannerMax = dur;
  G.bannerSize = size;
}
/** where the fruit actually sits: hanging off the end of the stem, not on it */
function gemAnchor(r){
  const tip = stem.tip, d = stem.tipDir();
  return { x: tip.x + d.x*r*0.80, y: tip.y + d.y*r*0.80, dx:d.x, dy:d.y };
}

/* --- run lifecycle -------------------------------------------------------- */
function startRun(){
  G.state = "play";
  G.timeLeft = RUN_TIME;
  G.score = 0; G.shown = 0;
  G.chain = 1;
  G.overtime = false; G.finalPluck = false; G.inFog = false;
  G.holdT = 0; G.regrow = 0; G.needRelease = false;
  G.gem = { present:true, scale:0 };
  G.burstAt = rollBurst();
  G.fly = null; G.freeze = 0; G.slowmo = 1;
  G.plucks = 0; G.bursts = 0; G.bestPluck = 0; G.deepest = 0; G.topChain = 1;
  G.clutches = 0; G.holdSum = 0; G.streak = 0; G.bestStreak = 0;
  G.pace = new Array(RUN_TIME+1).fill(0); G.paceIdx = 0;
  G.newBest = false;
  G.beepAt = 4;
  shards.length = 0; drops.length = 0; sparks.length = 0;
  pops.length = 0; rings.length = 0; splats.length = 0;
  stem.reset();
  Audio_.whoosh();
  banner("RIPEN!", "#8CF9A8", 0.85);
}

function endRun(){
  if (G.state !== "play") return;      // idempotent: several paths can reach here
  G.state = "results";
  G.resultsT = 0;
  G.holding = false;
  G.freeze = 0; G.slowmo = 1;
  Audio_.stopDrone();
  const s = Math.round(G.score);
  if (s > Save.data.best){
    G.newBest = true;
    Save.data.best = s;
    Save.data.pace = G.pace.slice();
    Audio_.fanfare();
  } else {
    Audio_.thud();
  }
  Save.data.runs      = (Save.data.runs||0) + 1;
  Save.data.bestChain  = Math.max(Save.data.bestChain||0,  G.topChain);
  Save.data.bestStreak = Math.max(Save.data.bestStreak||0, G.bestStreak);
  Save.data.bestPluck = Math.max(Save.data.bestPluck||0, Math.round(G.bestPluck));
  Save.data.deepest   = Math.max(Save.data.deepest||0, G.deepest);
  Save.save();
}

/** Holding down is not the same as ripening: after a burst the finger is still
    on the glass, and that must not arm the next fruit. */
function isArmed(){ return G.holding && !G.needRelease; }

function beginHold(){
  if (G.needRelease) return;                       // still holding from the burst
  if (!G.gem.present || G.gem.scale < 0.55) return;
  G.holdT = 0;
  G.inFog = false;
  Audio_.startDrone();
  Audio_.resetTick();
}

function doPluck(){
  const t = G.holdT;
  const inFog  = t > safeEndNow();
  const clutch = inFog && (G.burstAt - t) <= CLUTCH_WIN;   // no clutch without risk
  const otm  = G.overtime ? OVERTIME_MUL : 1;
  const gain = gemValue(t) * G.chain * otm * (clutch ? CLUTCH_MUL : 1);
  const missed = gemValue(G.burstAt) * G.chain * otm;

  G.score += gain;
  G.plucks++;
  G.holdSum += t;
  G.bestPluck = Math.max(G.bestPluck, gain);
  G.deepest = Math.max(G.deepest, t);
  if (clutch) G.clutches++;

  // green banks what you have; only the fog pushes the multiplier past ×3
  const cap = G.overtime ? 99 : CHAIN_CAP;
  const before = G.chain;
  G.chain = Math.min(cap, inFog ? G.chain + 1 : Math.min(GREEN_CAP, G.chain + 1));
  if (G.chain > before) G.chainPunch = 1;
  G.topChain = Math.max(G.topChain, G.chain);

  G.streak++;
  G.bestStreak = Math.max(G.bestStreak, G.streak);
  if (G.streak % 5 === 0){
    banner(`STREAK ${G.streak}`, G.streak >= 15 ? "#FF8CE0" : "#8CF9A8", 1.0);
    Audio_.milestone(G.streak);
    G.flash = 0.28; G.flashColor = "#B8FFD0";
    G.chainPunch = 1;
    addShake(8);
  }

  const r = gemRadius(t);
  const a = gemAnchor(r);
  const col = heatColor(t);
  const v = stem.tipVel(1/60);

  G.fly = {
    x: a.x, y: a.y, r,
    vx: clamp(v.vx,-700,700)*0.55 + rand(-90,90),
    vy: clamp(v.vy,-900,500)*0.55 - rand(520, 780),
    age: 0, col, tilt: 0, spin: rand(-5,5),
  };

  spawnSparks(a.x, a.y, 16, mixHex(col,"#ffffff",0.5), 520);
  ring(a.x, a.y, col, r*0.6, r*2.4, 0.42, 10);
  // On a win, show what the stem would have given you. Telling players what
  // they left behind is what makes them hold longer next time.
  const greenCapped = !inFog && before >= GREEN_CAP;
  popText(a.x, a.y - r - 26, "+" + fmt(gain), clutch ? "#FFF07A" : CREAM, {
    size: clamp(42 + Math.log2(1+gain/40)*9, 42, 96),
    sub: clutch      ? "CLUTCH ×1.5"
       : greenCapped ? "banked — no × from green"
       : missed > gain*1.12 ? "had " + fmt(missed) : null,
  });
  if (clutch){
    banner("CLUTCH!", "#FFF07A", 0.9);
    G.flash = 0.45; G.flashColor = "#FFF3A0";
    G.freeze = 0.07;
    addShake(12);
    ring(a.x, a.y, "#FFF07A", r*0.4, r*3.4, 0.55, 14);
  } else {
    addShake(4.5);
  }

  Audio_.pluck(G.chain, clutch);
  Audio_.stopDrone();

  stem.fling(G.fly.vx*0.8, G.fly.vy*0.8);
  Wind.gust(rand(-260,260));

  G.gem.present = false;
  G.regrow = REGROW_PLUCK;
  G.hudPunch = 1;
  G.holdT = 0; G.inFog = false;
  if (G.timeLeft <= 0) endRun();
}

function doBurst(){
  const t = G.burstAt;
  const r = gemRadius(t);
  const a = gemAnchor(r);
  const col = heatColor(t);

  G.bursts++;
  G.deepest = Math.max(G.deepest, t);
  const before = G.chain;
  const streakLost = G.streak;
  G.chain = Math.max(1, Math.floor(G.chain/2));
  G.streak = 0;

  spawnShards(a.x, a.y, r, col, randi(12,16), 620 + r*3.2);
  spawnDrops(a.x, a.y, 22, mixHex(col,"#ffffff",0.18), 520);
  spawnSparks(a.x, a.y, 22, "#FFFFFF", 700);
  ring(a.x, a.y, "#FF6B7A", r*0.5, r*4.2, 0.5, 16);
  ring(a.x, a.y, col, r*0.3, r*2.6, 0.34, 24);

  popText(a.x, a.y - 30, "BURST", "#FF5C6C", {
    size: 70, life: 1.5,
    sub: streakLost >= 3 ? `STREAK ${streakLost} LOST · ×${before}→×${G.chain}`
       : before > G.chain ? `CHAIN ×${before} → ×${G.chain}` : "CHAIN HELD ×1",
  });
  banner("TOO GREEDY", "#FF6B7A", 1.0, 54);

  addShake(32);
  G.flash = 0.46; G.flashColor = "#FF9AA6";
  G.freeze = 0.10;
  Audio_.burst();
  Audio_.stopDrone();
  stem.fling(rand(-400,400), -900);
  Wind.gust(rand(-500,500));

  G.gem.present = false;
  G.regrow = REGROW_BURST;
  G.holdT = 0; G.inFog = false;
  G.needRelease = true;
  if (G.timeLeft <= 0) endRun();
}

function releaseHold(){
  if (G.state !== "play") return;
  if (G.gem.present && G.holdT > 0.02) doPluck();
  else { Audio_.stopDrone(); G.holdT = 0; }
}

/* ----------------------------------------------------------------------------
   16. UPDATE
   -------------------------------------------------------------------------- */
function updatePlay(dt){
  if (G.timeLeft > 0){
    G.timeLeft = Math.max(0, G.timeLeft - dt);

    const idx = Math.min(RUN_TIME, Math.floor(RUN_TIME - G.timeLeft));
    while (G.paceIdx <= idx){ G.pace[G.paceIdx] = G.score; G.paceIdx++; }

    if (!G.overtime && G.timeLeft <= OVERTIME_AT){
      G.overtime = true;
      banner("OVERTIME", "#FF4D6D", 1.6);
      Audio_.overtime();
      addShake(20);
      G.flash = 0.5; G.flashColor = "#FF5C7A";
    }
    if (G.timeLeft <= G.beepAt && G.beepAt > 0){ Audio_.beep(G.beepAt <= 1); G.beepAt -= 1; }

    if (G.timeLeft <= 0 && isArmed() && G.gem.present && G.holdT > 0){
      G.finalPluck = true;
      banner("FINAL PLUCK", GOLD, 1.4);
      Audio_.whoosh();
    }
  }

  // Single source of truth for the buzzer: the run ends the moment there is
  // no live hold left to resolve. Without this, releasing at 0:00 without a
  // pluck leaves the run stranded forever.
  if (G.timeLeft <= 0){
    const resolving = isArmed() && G.gem.present && G.gem.scale >= 0.55 && G.holdT > 0;
    if (!resolving){ endRun(); return; }
  }

  if (G.overtime){
    G.otPulseT -= dt;
    if (G.otPulseT <= 0){ G.otPulseT = 0.5; Audio_.otPulse(); }
  }

  if (!G.gem.present){
    G.regrow -= dt;
    if (G.regrow <= 0){
      if (G.timeLeft <= 0){ endRun(); return; }
      G.gem.present = true;
      G.gem.scale = 0;
      G.burstAt = rollBurst();
      stem.reset();
      if (G.holding) beginHold();
    }
  } else {
    G.gem.scale = Math.min(1, G.gem.scale + dt*4.4);
    if (isArmed() && G.gem.scale >= 0.55){
      G.holdT += dt;
      if (!G.inFog && G.holdT > safeEndNow()){ G.inFog = true; Audio_.enterFog(); }
      if (G.holdT >= G.burstAt){ doBurst(); return; }
    }
  }

  if (isArmed() && G.gem.present){
    const strain = strainNow();
    Audio_.updateDrone(strain, clamp(G.holdT/FOG_END,0,1));
    Audio_.tickIfDue(strain, dt);
  }

  if (G.fly){
    const f = G.fly;
    f.age += dt;
    f.tilt += f.spin*dt;
    if (f.age < 0.26){
      f.vy += GRAV*0.75*dt;
      f.x += f.vx*dt; f.y += f.vy*dt;
    } else {
      const k = clamp((f.age-0.26)/0.42, 0, 1);
      const pull = clamp(easeOutCubic(k)*0.30 + 0.05, 0, 1);
      f.x = lerp(f.x, 136, pull);
      f.y = lerp(f.y, 100, pull);
      f.r *= (1 - 3.0*dt);
      if (k >= 1 || f.r < 8){
        G.hudPunch = 1;
        spawnSparks(136, 100, 8, GOLD, 230);
        ring(136, 100, GOLD, 12, 62, 0.32, 8);
        G.fly = null;
      }
    }
  }
}

function updateTitleDemo(dt){
  const d = G.titleDemo;
  if (d.hold){
    d.holdT += dt;
    if (d.holdT >= d.burstAt){
      const r = gemRadius(d.burstAt), a = gemAnchor(r), col = heatColor(d.burstAt);
      spawnSparks(a.x, a.y, 14, mixHex(col,"#fff",0.5), 460);
      ring(a.x, a.y, col, r*0.5, r*2.6, 0.45, 11);
      stem.fling(rand(-200,200), -760);
      d.hold = false; d.holdT = 0; d.cool = 0.75;
      d.burstAt = rand(0.9, 2.0);
    }
  } else {
    d.cool -= dt;
    if (d.cool <= 0){ d.hold = true; stem.reset(); }
  }
}

/* ----------------------------------------------------------------------------
   17. HUD
   -------------------------------------------------------------------------- */
function drawTimerBar(){
  const w = 268, h = 30, x = 360 - w/2, y = 40;
  const k = clamp(G.timeLeft/RUN_TIME, 0, 1);
  const urgent = G.timeLeft <= 10;
  const pulse = urgent ? 1 + Math.sin(G.t*13)*0.05 : 1;

  ctx.save();
  ctx.translate(360, y + h/2); ctx.scale(pulse, pulse); ctx.translate(-360, -(y + h/2));
  roundRect(x, y, w, h, h/2);
  ctx.fillStyle = "rgba(20,10,38,0.62)"; ctx.fill();
  inkStroke(6);
  if (k > 0){
    ctx.save();
    roundRect(x+4, y+4, w-8, h-8, (h-8)/2); ctx.clip();
    const col = urgent ? (G.overtime ? "#FF4D6D" : "#FF8A3C") : "#6BE49A";
    ctx.fillStyle = col;
    ctx.fillRect(x+4, y+4, (w-8)*k, h-8);
    ctx.fillStyle = shade(col, 0.30);
    ctx.fillRect(x+4, y+4, (w-8)*k, (h-8)*0.42);
    ctx.restore();
  }
  ctx.restore();
  celText(String(Math.ceil(Math.max(0,G.timeLeft))), 360, y + h/2 + 1,
          urgent ? 29 : 24, urgent ? "#FFE08A" : CREAM, { ow:6 });
}

function drawMuteButton(){
  ctx.save();
  ctx.translate(668, 1206);
  ctx.globalAlpha = 0.7;
  roundRect(-30,-30,60,60,18);
  ctx.fillStyle = "rgba(20,10,38,0.5)"; ctx.fill();
  roundRect(-30,-30,60,60,18); inkStroke(4);
  ctx.beginPath();
  ctx.moveTo(-12,-7); ctx.lineTo(-4,-7); ctx.lineTo(5,-16);
  ctx.lineTo(5,16); ctx.lineTo(-4,7); ctx.lineTo(-12,7);
  ctx.closePath();
  ctx.fillStyle = CREAM; ctx.fill();
  ctx.strokeStyle = CREAM; ctx.lineWidth = 3.4; ctx.lineCap = "round";
  if (Audio_.muted){
    ctx.beginPath(); ctx.moveTo(11,-9); ctx.lineTo(22,9); ctx.moveTo(22,-9); ctx.lineTo(11,9); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(6,0,12,-0.85,0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(6,0,19,-0.8,0.8); ctx.stroke();
  }
  ctx.restore();
}

function drawHUD(){
  const sTxt  = fmt(G.shown);
  const sSize = sTxt.length > 6 ? 48 : sTxt.length > 5 ? 55 : 62;
  ctx.save();
  ctx.translate(46, 116);
  const s = 1 + easeOutCubic(clamp(G.hudPunch,0,1))*0.26;
  ctx.scale(s, s);
  celText(sTxt, 0, 0, sSize, CREAM, { align:"left", shadow:5 });
  ctx.restore();

  if (G.state === "play"){
    if (Save.data.pace && Save.data.best > 0){
      const idx = Math.min(RUN_TIME, Math.floor(RUN_TIME - G.timeLeft));
      const d = G.score - (Save.data.pace[idx] || 0);
      if (Math.abs(d) > 1){
        celText((d>=0 ? "▲ " : "▼ ") + fmt(Math.abs(d)) + "  vs BEST",
                48, 166, 23, d>=0 ? "#8CF9A8" : "#FF95A3", { align:"left", ow:5 });
      }
    } else if (Save.data.best > 0){
      celText("BEST " + fmt(Save.data.best), 48, 166, 23, "rgba(255,243,220,0.6)", { align:"left", ow:5 });
    }
  }

  const capped = !G.overtime && G.chain >= CHAIN_CAP;
  const badge  = G.overtime ? "#FF4D6D" : (capped ? GOLD : "#9B7BD8");
  ctx.save();
  ctx.translate(672, 112);
  const cs = 1 + easeOutBack(clamp(G.chainPunch,0,1))*0.34;
  ctx.scale(cs, cs);
  const label = "×" + G.chain;
  const bw = Math.max(108, textWidth(label, 48) + 44);
  roundRect(-bw, -36, bw, 72, 22);
  ctx.fillStyle = badge; ctx.fill();
  ctx.save(); roundRect(-bw,-36,bw,72,22); ctx.clip();
  ctx.fillStyle = shade(badge, 0.26); ctx.fillRect(-bw,-36,bw,30);
  ctx.restore();
  roundRect(-bw, -36, bw, 72, 22); inkStroke(6);
  celText(label, -bw/2, 2, 47, (capped||G.overtime) ? INK : CREAM, { ow:0 });

  // Chain pips. The first GREEN_CAP are green — that is as far as safe plucks
  // will ever carry you. Everything gold has to be earned in the fog.
  const pw = 11, pgap = 4, totalW = CHAIN_CAP*pw + (CHAIN_CAP-1)*pgap;
  for (let i=0;i<CHAIN_CAP;i++){
    const lit   = i < G.chain;
    const green = i < GREEN_CAP;
    roundRect(-totalW + i*(pw+pgap), 40, pw, 12, 5);
    ctx.fillStyle = lit ? (G.overtime ? "#FF8CA6" : (green ? "#6BE49A" : GOLD))
                        : (green ? "rgba(107,228,154,0.22)" : "rgba(20,10,38,0.55)");
    ctx.fill();
  }
  if (G.chain > CHAIN_CAP){
    celText("+" + (G.chain - CHAIN_CAP), -totalW - 16, 46, 20, "#FF8CA6", { align:"right", ow:4 });
  }
  ctx.restore();

  if (G.overtime)                   celText("NO CEILING",        672, 188, 20, "#FF9AB0", { align:"right", ow:5 });
  else if (capped)                  celText("MAXED — GO DEEPER", 672, 188, 20, GOLD,      { align:"right", ow:5 });
  else if (G.chain >= GREEN_CAP)    celText("PAST ×3 NEEDS FOG", 672, 188, 20, "#FFB4C6", { align:"right", ow:5 });

  drawTimerBar();
}

function drawBanner(){
  if (G.bannerT <= 0) return;
  const gone = G.bannerMax - G.bannerT;
  const sc  = 0.72 + easeOutBack(clamp(gone*4.5, 0, 1))*0.28;
  ctx.save();
  ctx.globalAlpha = clamp(G.bannerT*4, 0, 1);
  ctx.translate(360, 926);
  ctx.rotate(Math.sin(G.t*9)*0.012);
  ctx.scale(sc, sc);
  celText(G.bannerText, 0, 0, G.bannerSize, G.bannerColor, { shadow:7, ow: G.bannerSize*0.21 });
  ctx.restore();
}

/* ----------------------------------------------------------------------------
   18. SCREENS
   -------------------------------------------------------------------------- */
/** the wordmark — drawn in the world pass so the fruit hangs in front of it */
function drawTitleMark(){
  ctx.save();
  ctx.translate(360, 742 + Math.sin(G.t*1.7)*8);
  ctx.rotate(Math.sin(G.t*0.9)*0.02);
  celText("PLUCK", 0, 0, 150, GOLD, { shadow:12, ow:23 });
  ctx.restore();
  celText("EVERMORE ARCADE", 360, 824, 24, "rgba(255,243,220,0.72)", { ow:6 });
}

/** the rules — drawn in the HUD pass so drifting leaves never eat a word */
function drawTitleText(){
  ctx.save();
  ctx.globalAlpha = 0.75 + Math.sin(G.t*3.2)*0.25;
  celText("HOLD  TO  RIPEN", 360, 930, 42, CREAM, { shadow:5 });
  ctx.restore();
  celText("RELEASE  BEFORE  IT  BURSTS", 360, 984, 29, "#FFB4C6", { ow:7 });
  celText("GREEN BANKS  ·  RED GROWS THE CHAIN", 360, 1030, 22, "#8CF9A8", { ow:5 });
  celText("60 SECONDS.  ALWAYS.", 360, 1068, 22, "rgba(255,243,220,0.6)", { ow:5 });

  if (Save.data.best > 0){
    roundRect(360-152, 1102, 304, 58, 22);
    ctx.fillStyle = "rgba(20,10,38,0.45)"; ctx.fill();
    roundRect(360-152, 1102, 304, 58, 22); inkStroke(5);
    celText("BEST  " + fmt(Save.data.best), 360, 1132, 32, GOLD, { ow:7 });
  }
  celText("HOLD ANYWHERE TO START", 360, 1206, 21, "rgba(255,243,220,0.5)", { ow:5 });
}

function verdict(){
  const avg = G.plucks ? G.holdSum/G.plucks : 0;
  const se  = (SAFE_EARLY + SAFE_LATE)/2;
  if (G.plucks + G.bursts === 0)  return "You didn't pluck a single one.";
  if (G.clutches >= 3)            return "Living on the edge. Terrifying to watch.";
  if (G.bursts === 0)             return "Ice cold — and capped at ×3 all run.";
  if (G.topChain <= GREEN_CAP)    return "Green only caps you at ×3. Go into the red.";
  if (avg < se*0.92)              return "Too safe. The money is past the green.";
  if (G.bursts > G.plucks*0.6)    return "Reckless. Beautiful, but reckless.";
  if (G.topChain >= CHAIN_CAP)    return "Chain maxed. Now hold longer.";
  return "Dialled in. Push half a second deeper.";
}

function drawResults(){
  const k = clamp(G.resultsT/0.32, 0, 1);
  ctx.save();
  ctx.globalAlpha = 0.82*k;
  ctx.fillStyle = "#14082a";
  ctx.fillRect(view.x0-10, view.y0-10, (view.x1-view.x0)+20, (view.y1-view.y0)+20);
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(0, (1-easeOutCubic(k))*90);

  const px = 70, pw = VW - 140, py = 224, ph = 662;
  roundRect(px, py, pw, ph, 40);
  ctx.fillStyle = "#2a1550"; ctx.fill();
  ctx.save(); roundRect(px,py,pw,ph,40); ctx.clip();
  ctx.fillStyle = "#371c66"; ctx.fillRect(px, py, pw, 116);
  ctx.restore();
  roundRect(px, py, pw, ph, 40); inkStroke(8);

  celText(G.newBest ? "NEW BEST!" : "TIME", 360, py+62, 44, G.newBest ? GOLD : CREAM, { ow:10 });

  ctx.save();
  ctx.translate(360, py+190);
  const bs = 1 + (G.newBest ? Math.sin(G.t*4)*0.03 : 0);
  ctx.scale(bs,bs);
  celText(fmt(G.shown), 0, 0, 114, G.newBest ? GOLD : CREAM, { shadow:8, ow:18 });
  ctx.restore();

  if (!G.newBest && Save.data.best > 0){
    const d = Math.round(G.score) - Save.data.best;
    celText(`${d>=0?"+":""}${fmt(d)} vs BEST ${fmt(Save.data.best)}`, 360, py+268, 25,
            d>=0 ? "#8CF9A8" : "#FF95A3", { ow:6 });
  } else if (G.newBest && Save.data.runs > 1){
    celText("PREVIOUS BEST BEATEN", 360, py+268, 25, "#8CF9A8", { ow:6 });
  }

  const stats = [
    ["PLUCKS",     String(G.plucks)],
    ["BURSTS",     String(G.bursts)],
    ["CLUTCH",     String(G.clutches)],
    ["STREAK",     String(G.bestStreak)],
    ["TOP PLUCK",  fmt(G.bestPluck)],
    ["DEEPEST",    G.deepest.toFixed(2) + "s"],
  ];
  const gx = px+44, gy = py+336, cw = (pw-88)/3;
  stats.forEach((s,i) => {
    const cx = gx + (i%3)*cw + cw/2, cy = gy + Math.floor(i/3)*94;
    celText(s[0], cx, cy,    20, "rgba(255,243,220,0.55)", { ow:4 });
    celText(s[1], cx, cy+38, 39, CREAM, { ow:8 });
  });

  const vtxt = verdict();
  let vsize = 26;
  while (textWidth(vtxt, vsize) > pw - 70 && vsize > 15) vsize -= 1;
  celText(vtxt, 360, py+ph-142, vsize, "#FFD9A0", { ow:5 });

  ctx.save();
  ctx.globalAlpha = k*(0.72 + Math.sin(G.t*3.6)*0.28);
  celText("HOLD TO PLAY AGAIN", 360, py+ph-62, 38, GOLD, { shadow:5 });
  ctx.restore();
  ctx.restore();

  ctx.save();
  ctx.globalAlpha = k;
  celText("60 SECONDS.  ONE MORE.", 360, 1004, 23, "rgba(255,243,220,0.5)", { ow:5 });
  ctx.restore();
}

/* ----------------------------------------------------------------------------
   19. RENDER
   -------------------------------------------------------------------------- */
function render(){
  const w = window.innerWidth, h = window.innerHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  bakeBackground();
  ctx.drawImage(bgCanvas, 0, 0, w, h);

  const playing = G.state === "play";
  const holdT   = G.state === "title" ? G.titleDemo.holdT : G.holdT;
  const showGem = G.state === "title" ? G.titleDemo.hold : (G.gem.present && playing);
  const strain  = G.state === "title"
    ? clamp((holdT - SAFE_EARLY)/(FOG_END - SAFE_EARLY), 0, 1)
    : (playing ? strainNow() : 0);

  let sx = 0, sy = 0;
  if (G.shake > 0.2){
    sx = Math.cos(G.shakeT*61)*G.shake;
    sy = Math.sin(G.shakeT*47)*G.shake*0.8;
  }
  // the camera leans in as the stem strains
  const zoom = 1 + strain*0.045;

  ctx.save();
  ctx.translate(ox + sx*scale, oy + sy*scale);
  ctx.scale(scale, scale);
  ctx.translate(360, 560); ctx.scale(zoom, zoom); ctx.translate(-360, -560);

  if (G.overtime && playing){
    ctx.save();
    ctx.globalAlpha = clamp(0.10 + Math.sin(G.t*6)*0.045, 0, 1);
    ctx.fillStyle = "#FF2D5E";
    ctx.fillRect(view.x0-40, view.y0-40, (view.x1-view.x0)+80, (view.y1-view.y0)+80);
    ctx.restore();
  }

  for (const m of motes) drawMote(m, G.t);
  for (const l of leaves) drawLeaf(l, 0.28);

  // the wordmark lives in the world, so the fruit dangles in front of it
  if (G.state === "title") drawTitleMark();

  for (const s of splats){
    const kk = clamp(1 - s.age/s.life, 0, 1);
    ctx.save(); ctx.globalAlpha = kk*0.5;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r*(1.5-kk*0.5), s.r*0.30, 0, 0, TAU);
    ctx.fillStyle = s.c; ctx.fill();
    ctx.restore();
  }

  drawBranch(Wind.value*0.010);

  const stemCol = mixHex("#3f9c5f", "#8a5a2a", clamp(strain,0,1));
  stem.draw(stemCol, shade(stemCol, 0.35), 12 + (showGem ? strain*5 : 0));

  if (showGem){
    const grow = G.state === "title" ? 1 : easeOutBack(clamp(G.gem.scale,0,1));
    const r    = Math.max(1, gemRadius(holdT) * grow);
    const a    = gemAnchor(r);
    const col  = heatColor(holdT);
    const shiv = strain*strain*10;
    const jx = (Math.random()-0.5)*shiv, jy = (Math.random()-0.5)*shiv;
    const v  = stem.tipVel(1/60);
    const sq = clamp(1 + clamp(v.vy,-1200,1200)/9000, 0.86, 1.16);
    const gx = a.x+jx, gy = a.y+jy;

    drawGem(gx, gy, r, col, {
      strain, sq, tilt: clamp(Math.atan2(a.dx, -a.dy), -0.42, 0.42),
      phase: G.t*7, glow: clamp((holdT - safeEndNow())/1.6, 0, 1),
    });

    if (playing && (isArmed() || holdT > 0)){
      const [lo,hi] = fogWindow();
      drawRing(gx, gy, r + 50, holdT, safeEndNow(), lo, hi, col,
               clamp(holdT*4, 0, 1), Math.floor(G.t*24),
               0.5 + 0.5*Math.sin(G.t*11));
      const val = gemValue(holdT) * G.chain * (G.overtime?OVERTIME_MUL:1);
      const fs  = clamp(r*0.50, 24, 60);
      ctx.save();
      ctx.globalAlpha = clamp(holdT*5,0,1);
      celText(fmt(val), gx, gy+2, fs, CREAM, { ow: Math.max(4, fs*0.22), shadow:3 });
      ctx.restore();
    }
  }

  if (G.fly){
    const f = G.fly;
    drawGem(f.x, f.y, Math.max(2,f.r), f.col,
            { sq:1, tilt:f.tilt, alpha:clamp(f.r/26,0,1), phase:G.t*7, glow:0.4, shadow:false });
  }

  for (const s of shards) drawShard(s);
  for (const d of drops)  drawDrop(d);
  for (const s of sparks) drawSpark(s);
  for (const l of leaves) drawLeaf(l, 0.9);

  for (const r of rings){
    const k = clamp(r.age/r.life, 0, 1);
    ctx.save();
    ctx.globalAlpha = (1-k)*0.85;
    ctx.beginPath();
    ctx.arc(r.x, r.y, lerp(r.r0, r.r1, easeOutCubic(k)), 0, TAU);
    ctx.strokeStyle = r.color; ctx.lineWidth = r.width*(1-k);
    ctx.stroke();
    ctx.restore();
  }

  for (const p of pops){
    const k = clamp(p.age/p.life, 0, 1);
    ctx.save();
    ctx.globalAlpha = clamp((1-k)*2.4, 0, 1);
    ctx.translate(p.x, p.y - easeOutCubic(clamp(p.age/0.55,0,1))*p.rise);
    const s = p.age < 0.16 ? easeOutBack(p.age/0.16) : 1;
    ctx.scale(s, s);
    celText(p.text, 0, 0, p.size, p.color, { shadow:5, ow: Math.max(6, p.size*0.20) });
    if (p.sub) celText(p.sub, 0, p.size*0.72, Math.max(19, p.size*0.36),
                       "rgba(255,243,220,0.72)", { ow:5 });
    ctx.restore();
  }

  drawBanner();
  ctx.restore();

  // HUD sits outside the zoom so it never drifts
  ctx.save();
  ctx.translate(ox + sx*scale, oy + sy*scale);
  ctx.scale(scale, scale);
  if (G.state === "title") drawTitleText();
  if (playing) drawHUD();
  if (G.state === "results"){ drawHUD(); drawResults(); }
  drawMuteButton();
  ctx.restore();

  // vignette — tightens and reddens as the stem strains
  ctx.save();
  const danger = playing ? strain : 0;
  const vg = ctx.createRadialGradient(
    w/2, h*0.46, Math.min(w,h)*(0.34 - danger*0.12),
    w/2, h*0.50, Math.max(w,h)*0.78);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, (G.overtime && playing)
      ? "rgba(74,0,26,0.58)"
      : `rgba(${Math.round(18+90*danger)},6,${Math.round(34-8*danger)},${0.48+0.22*danger})`);
  ctx.fillStyle = vg; ctx.fillRect(0,0,w,h);
  ctx.restore();

  if (G.flash > 0.005){
    ctx.save();
    ctx.globalAlpha = clamp(G.flash,0,1)*0.55;
    ctx.fillStyle = G.flashColor;
    ctx.fillRect(0,0,w,h);
    ctx.restore();
  }
}

/* ----------------------------------------------------------------------------
   20. INPUT
   -------------------------------------------------------------------------- */
let pressed = false;

function toVirtual(clientX, clientY){
  const b = cvs.getBoundingClientRect();
  return { x: (clientX - b.left - ox)/scale, y: (clientY - b.top - oy)/scale };
}
function press(vx, vy){
  Audio_.init(); Audio_.resume();
  if (vx > 630 && vx < 710 && vy > 1168 && vy < 1248){
    Audio_.setMuted(!Audio_.muted);
    Save.data.muted = Audio_.muted; Save.save();
    if (!Audio_.muted) Audio_.beep(false);
    return;
  }
  if (G.state === "title"){ startRun(); G.holding = true; beginHold(); return; }
  if (G.state === "results"){
    if (G.resultsT < 0.55) return;                 // grace: no accidental restarts
    startRun(); G.holding = true; beginHold(); return;
  }
  G.holding = true; beginHold();
}
function release(){
  if (G.state === "play") releaseHold();
  G.holding = false;
  G.needRelease = false;
}

cvs.addEventListener("pointerdown", e => {
  e.preventDefault();
  if (pressed) return;
  pressed = true;
  const v = toVirtual(e.clientX, e.clientY);
  press(v.x, v.y);
}, { passive:false });
window.addEventListener("pointerup",     () => { if (pressed){ pressed = false; release(); } });
window.addEventListener("pointercancel", () => { if (pressed){ pressed = false; release(); } });
window.addEventListener("blur",          () => { if (pressed){ pressed = false; release(); } });
window.addEventListener("contextmenu",   e => e.preventDefault());

const HOLD_KEYS = { Space:1, Enter:1, ArrowDown:1, KeyF:1 };
window.addEventListener("keydown", e => {
  if (HOLD_KEYS[e.code]){
    e.preventDefault();
    if (e.repeat || pressed) return;
    pressed = true; press(-999,-999);
  } else if (e.code === "KeyM"){
    Audio_.init();
    Audio_.setMuted(!Audio_.muted);
    Save.data.muted = Audio_.muted; Save.save();
  }
});
window.addEventListener("keyup", e => {
  if (HOLD_KEYS[e.code]){
    e.preventDefault();
    if (!pressed) return;
    pressed = false; release();
  }
});

/* ----------------------------------------------------------------------------
   21. MAIN LOOP
   -------------------------------------------------------------------------- */
let last = performance.now();
let acc = 0;
const PHYS_DT = 1/120;

function frame(now){
  requestAnimationFrame(frame);
  let raw = (now - last)/1000;
  last = now;
  if (raw > 0.1) raw = 0.1;               // tab-switch guard
  G.t += raw;

  // hit-stop, then slow-motion for the final pluck
  let dt = raw;
  if (G.freeze > 0){ G.freeze -= raw; dt = 0; }
  const wantSlow = (G.state === "play" && G.finalPluck && G.gem.present) ? 0.5 : 1;
  G.slowmo += (wantSlow - G.slowmo) * clamp(raw*8, 0, 1);
  dt *= G.slowmo;

  Wind.update(raw);

  if (G.state === "play") updatePlay(dt);
  else if (G.state === "title") updateTitleDemo(dt);
  else if (G.state === "results") G.resultsT += raw;

  // stem physics on a fixed step so it can never explode
  const holdT   = G.state === "title" ? G.titleDemo.holdT : G.holdT;
  const attached= G.state === "title" ? G.titleDemo.hold : (G.gem.present && G.state === "play");
  const strain  = G.state === "title"
    ? clamp((holdT - SAFE_EARLY)/(FOG_END - SAFE_EARLY), 0, 1)
    : strainNow();
  const stretch = 1 + strain*0.30 + clamp(holdT,0,FOG_END)*0.045;
  const mass    = attached ? gemMass(holdT) : 1;

  acc += dt;
  let steps = 0;
  while (acc >= PHYS_DT && steps < 8){
    stem.step(PHYS_DT, { stretch, mass, wind: Wind.value, attached });
    acc -= PHYS_DT; steps++;
  }
  if (steps === 8) acc = 0;

  updateParticles(dt, G.t);

  G.shown += (G.score - G.shown) * clamp(raw*7.5, 0, 1);
  if (Math.abs(G.score - G.shown) < 0.6) G.shown = G.score;
  G.hudPunch   = Math.max(0, G.hudPunch   - raw*3.6);
  G.chainPunch = Math.max(0, G.chainPunch - raw*2.6);
  G.shake      = Math.max(0, G.shake - raw*(48 + G.shake*4));
  G.shakeT    += raw;
  G.flash      = Math.max(0, G.flash - raw*2.6);
  G.bannerT    = Math.max(0, G.bannerT - raw);

  render();
}

/* ----------------------------------------------------------------------------
   22. BOOT
   -------------------------------------------------------------------------- */
resize();
initAmbient();
stem.reset();
for (let i=0;i<200;i++) stem.step(PHYS_DT, { stretch:1, mass:1, wind:0, attached:true });
requestAnimationFrame(frame);
window.__PLUCK = G;   // handy for tuning from the console
</script>
