  for (let i=0;i<ENT.length;i++){ const e=ENT[i]; if (e.live && e.kind===2) drawJelly(e); }
  drawLine(); drawStringer(); drawHook(); drawFX();
  drawBoat();
  ctx.restore();
  /* depth vignette — the abyss closes in */
  const dv = clamp(HK.y/K.DMAX, 0, 1);
  const vg = ctx.createRadialGradient(w*0.5, STAGE.PY+STAGE.PH*0.45, STAGE.PH*0.22,
                                      w*0.5, STAGE.PY+STAGE.PH*0.45, STAGE.PH*0.92);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,'+(0.34+0.34*dv).toFixed(2)+')');
  ctx.fillStyle = vg; ctx.fillRect(0,0,w,h);
  /* closing phase: a warm rim on the whole frame (palette shift 3) */
  if (FX.heat > 0.01){
    const hg = ctx.createLinearGradient(0, STAGE.PY, 0, STAGE.PY+STAGE.PH);
    hg.addColorStop(0, rgba(C.hot, 0.16*FX.heat)); hg.addColorStop(0.5, rgba(C.hot,0));
    hg.addColorStop(1, rgba(C.red, 0.12*FX.heat));
    ctx.fillStyle = hg; ctx.fillRect(0,0,w,h);
  }
  /* desaturate everything but the cause, for 167 ms after a snap */
  if (FX.desat > 0.01){
    ctx.fillStyle = rgba('#0A1424', FX.desat*0.42); ctx.fillRect(0,0,w,h);
  }
  ctx.restore();

  drawHud();
  drawHint();
  if (RUN.state === 'over') drawResult();
  if (FX.flash > 0.002){
    ctx.fillStyle = rgba(FX.flashCol, FX.flash*0.5); ctx.fillRect(0,0,w,h);
  }
}

/* ================================================================= INPUT */
function localPt(e){ const r = cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
function testHits(x,y){
  for (let i=HITS.length-1;i>=0;i--){ const h=HITS[i];
    if (x>=h.x && x<=h.x+h.w && y>=h.y && y<=h.y+h.h) return h; }
  return null;
}
let ptrId = -1, ptrSX = 0;
function pointerDown(e){
  S.init(); S.on = !!SAVE.sound;
  const p = localPt(e);
  if (RUN.state === 'over'){
    const h = testHits(p.x, p.y);
    if (h && h.id === 'retry'){ S.ui(1); startRun((RUN.seed*1664525+1013904223)>>>0); }
    e.preventDefault(); return;
  }
  ptrId = e.pointerId; ptrSX = p.x;
  PTR.down = true; RUN.touched = true;
  /* grab offset so the hook never teleports under the thumb (§8.3) */
  PTR.x = ux(p.x);
  PTR.grab = clamp(HK.x - PTR.x, -14, 14); PTR.gt = K.GRAB_DECAY;
  e.preventDefault();
}
function pointerMove(e){
  if (!PTR.down || e.pointerId !== ptrId) return;
  const p = localPt(e); ptrSX = p.x; PTR.x = ux(p.x);
  e.preventDefault();
}
function pointerUp(e){
  if (e.pointerId !== ptrId) return;
  PTR.down = false; ptrId = -1; e.preventDefault();
}
cv.addEventListener('pointerdown', pointerDown, {passive:false});
cv.addEventListener('pointermove', pointerMove, {passive:false});
window.addEventListener('pointerup', pointerUp, {passive:false});
window.addEventListener('pointercancel', pointerUp, {passive:false});
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ================================================================== LOOP */
let acc = 0, last = 0, running = true;
const FIXED = 1/60;
function frame(now){
  requestAnimationFrame(frame);
  if (!running) return;
  if (!last) last = now;
  let dt = (now-last)/1000; last = now;
  if (dt > 0.25) dt = 0.25;
  /* hitstop is presentation-only. It must never pause the countdown, or
     mistakes buy run time and the whole format inverts (§7.9b). */
  let simDt = dt;
  if (FX.hitstop > 0){ FX.hitstop -= dt; simDt = 0; }
  acc += simDt;
  let guard = 0;
  while (acc >= FIXED && guard++ < 5){ simStep(FIXED); acc -= FIXED; }
  if (PTR.gt > 0){ PTR.gt -= dt; PTR.grab *= clamp(PTR.gt/K.GRAB_DECAY, 0, 1); }
  RUN.shown += (RUN.score - RUN.shown) * (1 - Math.exp(-11*dt));
  if (Math.abs(RUN.score - RUN.shown) < 0.6) RUN.shown = RUN.score;
  stepCam(dt); stepFX(dt);
  draw();
}

/* ================================================================ HARNESS
   The bot fleet drives the sim through here. Nothing below touches the DOM.
   __FA.pump(sec, fn) runs a whole session headless at a fixed tick; the
   degenerate bots are ALSO driven through the real pointer path (see
   _fathombot.js dom()) because that is where input bugs hide.             */
window.__FA = {
  K, C, HK, BOAT, RUN, FX, ENT, ROWS, FISH, BANDS, STAGE, SAVE, PTR,
  depthMult, dEff, timeToSurface, frayRate, bandAt, segDist, reelSpeed, sinkSpeed,
  TRAIL, trailX, trailN(){ return TN; }, laneAt, laneMin,
  start(seed){ RENDER = false; startRun(seed||1); },
  startFull(seed){ startRun(seed||1); },
  render(on){ RENDER = !!on; },
  step(dt){ simStep(dt||FIXED); },
  input(down, x){ PTR.down = !!down; if (down) RUN.touched = true;
    if (x !== undefined) PTR.x = clamp(x, 0, K.W); PTR.grab = 0; },
  pump(sec, fn, dt){
    dt = dt || FIXED;
    const n = Math.ceil((sec || K.RUN_TIME + 1)/dt);
    for (let i=0;i<n;i++){
      if (RUN.state === 'over') break;
      if (fn) fn(this.state());
      simStep(dt);
    }
    return this.result();
  },
  state(){ return { x:HK.x, y:HK.y, vx:HK.vx, mode:HK.mode, fray:HK.fray,
    pool:HK.pool, n:HK.n, maxD:HK.maxD, t:RUN.t, left:RUN.left, score:RUN.score,
    streak:RUN.streak, dEff:RUN.dEff, boat:BOAT.x }; },
  result(){ return { score:RUN.score, catches:RUN.catches, banks:RUN.banks,
    snaps:RUN.snaps, deepest:Math.round(RUN.deepest/K.FM), best:RUN.bestBank,
    streak:RUN.bestStreak, clock:Math.round(RUN.clockDmg*10)/10,
    lost:RUN.lostAtSiren, log:RUN.log.slice() }; },
  /* everything live within `rad` of the hook — the bots' only sensor */
  scan(rad){
    const out = [];
    for (let i=0;i<ENT.length;i++){
      const e = ENT[i]; if (!e.live || e.gone>0) continue;
      if (Math.abs(e.y - HK.y) > (rad||150)) continue;
      out.push({k:e.kind, t:e.t, x:e.x, y:e.y, r:e.r, val:e.val, foul:e.foul});
    }
    return out;
  },
  freeze(v){ running = !v; },
  draw(){ draw(); },
  /* a backgrounded tab never fires rAF — advance() runs sim AND present */
  advance(sec, fn, dt){
    dt = dt || FIXED;
    const n = Math.ceil((sec||0)/dt);
    for (let i=0;i<n;i++){
      if (fn) fn(this.state());
      simStep(dt);
      RUN.shown += (RUN.score - RUN.shown)*0.16;
      stepCam(dt); stepFX(dt);
    }
    draw();
  },
};

/* ================================================================== BOOT */
window.addEventListener('resize', ()=>{ resize(); });
window.addEventListener('orientationchange', ()=>setTimeout(resize, 120));
document.documentElement.style.setProperty('--sat','env(safe-area-inset-top)');
resize();
startRun((Math.random()*1e9)|0);
requestAnimationFrame(frame);
</script>
</body>
</html>
